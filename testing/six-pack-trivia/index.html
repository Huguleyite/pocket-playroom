var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],

function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let hostPeer = null, roomCode = "", deck = [], currentIdx = -1, phase = "LOBBY", gameId = 0;
let questionStartTime = 0, timerInterval = null, botTimers = [], revealPending = null;
let safetyNetEnabled = true, botCounter = 0;
const players = new Map();
const selectedCategories = new Set(ALL_CATEGORIES);
const usedIds = new Set();

function generateRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function joinAddress() { return location.protocol.startsWith("http") ? location.host + location.pathname.replace(/index\.html$/, "").replace(/\/$/, "") : ""; }
function renderJoinLine() {
  const addr = joinAddress();
  const qrBox = $("joinQr"), qrLink = $("joinQrLink");
  qrBox.hidden = true;
  qrLink.replaceChildren();
  if (addr && roomCode && typeof qrcode === "function") {
    try {
      const joinUrl = new URL(location.pathname, location.origin);
      joinUrl.searchParams.set("room", roomCode);
      const qr = qrcode(0, "M");
      qr.addData(joinUrl.href);
      qr.make();
      qrLink.href = joinUrl.href;
      qrLink.innerHTML = qr.createSvgTag({cellSize:4, margin:16, scalable:true, alt:"Scan to join room " + roomCode});
      qrBox.hidden = false;
    } catch (e) { /* Keep the typed address and room code available. */ }
  }
  $("joinLine").innerHTML = addr
    ? `On your phone, go to <b>${escapeHtml(addr)}</b><br>and enter room code <b>${escapeHtml(roomCode)}</b>`
    : `⚠️ Phones can't join a file opened from this computer. Put it online first, then share that web address.`;
}
function initHost() {
  if (typeof Peer === "undefined") { $("hostStatusText").textContent = "⚠️ Couldn't load the connection library. Check the internet and refresh."; return; }
  roomCode = generateRoomCode();
  $("hostRoomCode").textContent = roomCode;
  renderJoinLine();
  $("hostStatusText").textContent = "Opening the room...";
  const peer = new Peer(PREFIX + roomCode);
  hostPeer = peer;
  peer.on("open", () => { $("hostStatusText").textContent = "🟢 Room Open & Ready"; });
  peer.on("disconnected", () => {
    $("hostStatusText").textContent = "🟡 Reconnecting the room...";
    setTimeout(() => { if (hostPeer === peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500);
  });
  peer.on("error", err => {
    if (hostPeer !== peer) return;
    if (err.type === "unavailable-id" && players.size === 0) { peer.destroy(); initHost(); return; }
    $("hostStatusText").textContent = "⚠️ Network hiccup: " + err.type;
    if (peer.destroyed && players.size === 0) setTimeout(() => { if (hostPeer === peer) initHost(); }, 3000);
  });
  peer.on("connection", conn => {
    conn.on("data", msg => handleHostMessage(conn, msg));
    conn.on("close", () => {
      const p = players.get(conn.pid);
      if (p && p.conn === conn) { p.lastSeen = 0; refreshPlayers(); checkAllAnswered(); }
    });
  });
}
function isConnected(p) { return p.isBot || !!(p.conn && p.conn.open && Date.now() - p.lastSeen < 12000); }
function safeSend(conn, data) { try { if (conn && conn.open) conn.send(data); } catch (e) {} }

function newPlayer(id, name, conn, isBot) {
  const taken = new Set([...players.values()].map(p => p.avatar));
  const avatar = AVATARS.find(a => !taken.has(a)) || pickOne(AVATARS);
  return { id, name, avatar, conn, isBot, score:0, streak:0, picks:[], locked:false, staged:null, pickTime:0, lastEarned:0, lastSeen:Date.now() };
}
function handleHostMessage(conn, msg) {
  if (!msg || !msg.type) return;
  if (msg.type === "JOIN") {
    let pid = String(msg.playerId || conn.peer).slice(0, 40);
    const name = String(msg.name || "Player").trim().slice(0, 14) || "Player";
    /* Two tabs on one device share an ID; a different nickname makes a separate player. */
    const holder = players.get(pid);
    if (holder && holder.name !== name && (players.has(pid + "~" + name) || isConnected(holder))) pid += "~" + name;
    let p = players.get(pid);
    if (p) {
      const old = p.conn;
      p.conn = conn; p.lastSeen = Date.now(); p.name = name; conn.pid = pid;
      if (old && old !== conn) { safeSend(old, { type:"REPLACED" }); setTimeout(() => { try { old.close(); } catch (e) {} }, 500); }
    } else {
      if (players.size >= MAX_PLAYERS) { safeSend(conn, { type:"FULL" }); setTimeout(() => { try { conn.close(); } catch (e) {} }, 500); return; }
      p = newPlayer(pid, name, conn, false); conn.pid = pid; players.set(pid, p);
    }
    refreshPlayers(); syncPlayer(p);
    return;
  }
  const p = players.get(conn.pid);
  if (!p || p.conn !== conn) return;
  const wasAway = !isConnected(p);
  p.lastSeen = Date.now();
  if (wasAway) refreshPlayers();
  if (msg.type === "PING") { safeSend(conn, { type:"PONG" }); return; }
  if (msg.type === "LEAVE") { players.delete(p.id); refreshPlayers(); checkAllAnswered(); return; }
  if (phase !== "QUESTION" || msg.key !== roundKey() || p.locked) return;
  const valid = n => Number.isInteger(n) && n >= 0 && n <= 5;
  if (msg.type === "STAGE") { p.staged = safetyNetEnabled && valid(msg.choice) ? msg.choice : null; return; }
  if (msg.type === "PICK") {
    const picks = [...new Set(Array.isArray(msg.picks) ? msg.picks : [])].filter(valid).slice(0, safetyNetEnabled ? 2 : 1);
    if (!picks.length) return;
    p.picks = picks; p.locked = true; p.staged = null; p.pickTime = Date.now();
    renderDock(); syncPlayer(p); checkAllAnswered();
  }
}
setInterval(() => { if (!hostPeer || !players.size) return; renderDock(); checkAllAnswered(); }, 2000);

function addBotPlayer() {
  if (players.size >= MAX_PLAYERS) return;
  const pid = "bot-" + (++botCounter) + "-" + Date.now();
  players.set(pid, newPlayer(pid, BOT_NAMES[(botCounter - 1) % BOT_NAMES.length], null, true));
  refreshPlayers();
}
function removePlayer(id) {
  const p = players.get(id);
  if (!p) return;
  safeSend(p.conn, { type:"KICK" });
  players.delete(id);
  refreshPlayers();
  checkAllAnswered();
}
function refreshPlayers() { renderLobbyPlayers(); renderDock(); }

/* ---- Game flow ---- */
/* Draws evenly across the chosen categories, unseen questions first, then shuffles each option set. */
function buildDeck(count) {
  const buckets = shuffle([...selectedCategories]).map(cat => {
    const all = QUESTIONS.filter(q => q.category === cat);
    return shuffle(all.filter(q => !usedIds.has(q.id))).concat(shuffle(all.filter(q => usedIds.has(q.id))));
  }).filter(b => b.length);
  const out = [];
  while (out.length < count && buckets.some(b => b.length)) {
    for (const b of buckets) { if (out.length >= count) break; if (b.length) out.push(b.shift()); }
  }
  return shuffle(out).map(q => {
    const order = shuffle([0,1,2,3,4,5]);
    return { ...q, options: order.map(i => q.options[i]), answerIndex: order.indexOf(q.answerIndex) };
  });
}
function showHostPanel(name) { $("hostLobby").hidden = name !== "lobby"; $("hostStage").hidden = name !== "stage"; $("hostPodium").hidden = name !== "podium"; }
function startGame() {
  const pool = matchingPool();
  if (!pool.length || !players.size) return;
  const v = $("roundCountSelect").value;
  deck = buildDeck(v === "ALL" ? pool.length : Math.min(Number(v) || 10, pool.length));
  currentIdx = -1; gameId = Date.now();
  players.forEach(p => { p.score = 0; p.streak = 0; });
  keepAwake();
  showHostPanel("stage");
  nextQuestion();
}
function roundKey() { return gameId + ":" + currentIdx; }
function clearRoundTimers() { clearInterval(timerInterval); botTimers.forEach(clearTimeout); botTimers = []; clearTimeout(revealPending); revealPending = null; }

function nextQuestion() {
  clearRoundTimers();
  currentIdx++;
  if (currentIdx >= deck.length) { showPodium(); return; }
  phase = "QUESTION";
  const q = deck[currentIdx];
  usedIds.add(q.id);
  questionStartTime = Date.now();
  players.forEach(p => { p.picks = []; p.locked = false; p.staged = null; p.pickTime = 0; p.lastEarned = 0; });

  $("hostRoundBadge").textContent = `ROUND ${currentIdx + 1} / ${deck.length}`;
  $("qCategory").textContent = q.category;
  $("qText").textContent = q.question;
  $("factBox").hidden = true;
  $("btnRevealEarly").hidden = false;
  $("btnNextQuestion").hidden = true;
  setMedia($("mediaFrame"), gifUrl(questionGif(q)), q.mediaCaption);

  const grid = $("hostOptionsGrid");
  grid.innerHTML = "";
  q.options.forEach((opt, i) => {
    const m = TILE_META[i];
    const tile = document.createElement("div");
    tile.className = "host-tile"; tile.id = "hostTile-" + i;
    tile.innerHTML = `<div class="vote-bar" id="voteBar-${i}" style="background:${m.color}"></div>
      <div class="tile-badge" style="background:${m.color}"><span style="font-size:.85rem;line-height:1">${m.shape}</span><span style="font-size:1.1rem;line-height:1">${m.letter}</span></div>
      <div class="tile-label">${escapeHtml(opt)}</div><div class="vote-count" id="voteCount-${i}" hidden></div>`;
    grid.appendChild(tile);
  });

  [q.revealGif, deck[currentIdx + 1] && questionGif(deck[currentIdx + 1])].forEach(id => { if (id) new Image().src = gifUrl(id); });
  renderDock(); broadcastState(); scheduleBotAnswers(q);

  $("timerFill").style.width = "100%";
  $("timerNum").textContent = QUESTION_DURATION + "s";
  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - questionStartTime) / 1000;
    $("timerFill").style.width = Math.max(0, 100 - elapsed / QUESTION_DURATION * 100) + "%";
    $("timerNum").textContent = Math.max(0, Math.ceil(QUESTION_DURATION - elapsed)) + "s";
    if (elapsed >= QUESTION_DURATION) revealAnswer();
  }, 200);
}
function scheduleBotAnswers(q) {
  players.forEach(p => {
    if (!p.isBot) return;
    botTimers.push(setTimeout(() => {
      if (phase !== "QUESTION" || p.locked) return;
      const first = Math.random() < .55 ? q.answerIndex : Math.floor(Math.random() * 6);
      p.picks = [first];
      if (safetyNetEnabled && Math.random() < .35) p.picks.push(pickOne([0,1,2,3,4,5].filter(n => n !== first)));
      p.locked = true; p.pickTime = Date.now();
      renderDock(); checkAllAnswered();
    }, 2500 + Math.random() * 8000));
  });
}
function everyoneIn() { const here = [...players.values()].filter(isConnected); return here.length > 0 && here.every(p => p.locked); }
function checkAllAnswered() {
  if (phase !== "QUESTION" || revealPending || !everyoneIn()) return;
  const key = roundKey();
  revealPending = setTimeout(() => { revealPending = null; if (phase === "QUESTION" && key === roundKey() && everyoneIn()) revealAnswer(); }, 700);
}
function revealAnswer() {
  if (phase !== "QUESTION") return;
  phase = "REVEAL";
  clearRoundTimers();
  $("timerFill").style.width = "0%";
  $("timerNum").textContent = "0s";
  const q = deck[currentIdx], counts = [0,0,0,0,0,0];
  let answered = 0, hits = 0;
  players.forEach(p => {
    if (!p.locked && p.staged !== null) { p.picks = [p.staged]; p.pickTime = Date.now(); }
    p.locked = true;
    if (p.picks.length) answered++;
    p.picks.forEach(i => counts[i]++);
    const hit = p.picks.includes(q.answerIndex);
    if (hit) hits++;
    if (hit && p.picks.length === 1) {
      const elapsed = Math.min(QUESTION_DURATION, (p.pickTime - questionStartTime) / 1000);
      const speed = Math.round(Math.max(0, 1 - elapsed / QUESTION_DURATION) * 400);
      p.streak++;
      p.lastEarned = 600 + speed + (p.streak > 1 ? 100 : 0);
      if (safetyNetEnabled) p.lastEarned = Math.min(1000, p.lastEarned);
    } else {
      p.streak = 0;
      p.lastEarned = hit ? 400 : 0;
    }
    p.score += p.lastEarned;
    p.playedKey = roundKey();
  });
  q.options.forEach((_, i) => {
    const pct = answered ? Math.round(counts[i] / answered * 100) : 0;
    $("voteBar-" + i).style.width = pct + "%";
    const c = $("voteCount-" + i); c.textContent = `${counts[i]} (${pct}%)`; c.hidden = false;
    $("hostTile-" + i).classList.add(i === q.answerIndex ? "correct" : "dimmed");
  });
  const mood = !answered || !hits ? "none" : hits === answered ? "all" : "some";
  const reactionCaption = { all:"🔥 EVERYBODY ATE!", some:"👀 SOME OF Y'ALL KNEW", none:"🤦 NOT ONE OF Y'ALL!" }[mood];
  setMedia($("mediaFrame"), gifUrl(q.revealGif || pickOne(REACTIONS[mood])), reactionCaption);
  $("factBox").innerHTML = `💡 <strong>Did You Know?</strong> ${escapeHtml(q.fact)}`;
  $("factBox").hidden = false;
  $("btnRevealEarly").hidden = true;
  $("btnNextQuestion").hidden = false;
  $("btnNextQuestion").disabled = true;
  setTimeout(() => { $("btnNextQuestion").disabled = false; }, 800);
  $("btnNextQuestion").textContent = currentIdx + 1 >= deck.length ? "See Final Scores 🏆" : "Next Question ➔";
  renderDock(); broadcastState();
}
function ranked() { return [...players.values()].sort((a, b) => b.score - a.score); }
function rankOf(p) { return 1 + [...players.values()].filter(x => x.score > p.score).length; }
function showPodium() {
  clearRoundTimers();
  phase = "PODIUM";
  showHostPanel("podium");
  $("hostRoundBadge").textContent = "FINAL";
  const board = $("finalScoreboard");
  board.innerHTML = "";
  ranked().forEach(p => {
    const r = rankOf(p), medal = r === 1 ? "🥇" : r === 2 ? "🥈" : r === 3 ? "🥉" : "#" + r;
    const row = document.createElement("div");
    row.className = "score-row" + (r === 1 ? " first" : "");
    row.innerHTML = `<span>${medal} ${p.avatar} ${escapeHtml(p.name)}</span><span style="color:var(--gold)">${p.score.toLocaleString()} pts</span>`;
    board.appendChild(row);
  });
  setMedia($("podiumMedia"), gifUrl(pickOne(REACTIONS.podium)), "👑 BRAGGING RIGHTS SECURED");
  broadcastState();
}
function resetToLobby() { clearRoundTimers(); phase = "LOBBY"; showHostPanel("lobby"); $("hostRoundBadge").textContent = "LOBBY"; refreshPlayers(); broadcastState(); }
function renderDock() {
  const dock = $("dockAvatars");
  dock.innerHTML = "";
  players.forEach(p => {
    const pill = document.createElement("div");
    const away = !isConnected(p);
    let cls = "", tail = "";
    if (phase === "REVEAL") { cls = p.lastEarned ? " locked" : " miss"; tail = ` +${p.lastEarned} · ${p.score.toLocaleString()}`; }
    else if (p.locked) { cls = " locked"; tail = p.picks.length === 2 ? " 🛡️" : " ✓"; }
    if (away) { cls += " away"; tail += " 💤"; }
    pill.className = "dock-pill" + cls;
    pill.textContent = `${p.avatar} ${p.name}${tail}`;
    dock.appendChild(pill);
  });
}
function broadcastState() { players.forEach(syncPlayer); }
function syncPlayer(p) {
  if (!p.conn || !p.conn.open) return;
  const payload = { type:"STATE", phase, key:roundKey(), score:p.score, rank:rankOf(p), totalPlayers:players.size,
    avatar:p.avatar, safetyNetEnabled, picks:p.picks, locked:p.locked };
  if (phase === "QUESTION") {
    const q = deck[currentIdx];   /* anti-cheat: answerIndex and fact are never sent during the round */
    Object.assign(payload, { question:q.question, category:q.category, media:{ url:gifUrl(questionGif(q)), caption:q.mediaCaption },
      options:q.options, round:`${currentIdx + 1}/${deck.length}`, secondsLeft:Math.max(0, QUESTION_DURATION - (Date.now() - questionStartTime) / 1000) });
  } else if (phase === "REVEAL") {
    const q = deck[currentIdx];
    Object.assign(payload, { correctIndex:q.answerIndex, correctLabel:q.options[q.answerIndex], earned:p.lastEarned, waiting:p.playedKey !== roundKey() });
  }
  safeSend(p.conn, payload);
}

/* ================= 4. PHONE CONTROLLER ================= */
const client = { peer:null, conn:null, gen:0, joined:false, code:"", name:"", lastMsg:0, tries:0, retryTimer:null,
  state:null, key:"", staged:null, armed:false, sent:false, endsAt:0 };
let myPlayerId = store("sixpack_pid");
if (!myPlayerId) { myPlayerId = "player-" + Math.random().toString(36).slice(2, 12); store("sixpack_pid", myPlayerId); }

function setBanner(icon, title, sub, color) {
  $("bannerIcon").textContent = icon; $("bannerTitle").textContent = title; $("bannerTitle").style.color = color || "var(--text)"; $("bannerSub").textContent = sub;
  $("phoneBanner").hidden = false; $("padGrid").hidden = true; $("padActionBar").hidden = true; $("phoneQuestion").hidden = true; $("phoneMedia").hidden = true; $("ctrlTimer").textContent = "";
  client.endsAt = 0;
}
function joinRoom() {
  const code = $("inputRoomCode").value.trim().toUpperCase();
  const name = $("inputPlayerName").value.trim() || "Player";
  if (code.length !== 4) { $("phoneJoinStatus").textContent = "Please enter the 4-character room code."; return; }
  store("sixpack_name", name);
  client.code = code; client.name = name; client.tries = 0; client.joined = false;
  $("btnJoinRoom").disabled = true;
  $("phoneJoinStatus").textContent = "Connecting to room " + code + "...";
  connectToHost();
}
function connectToHost() {
  if (typeof Peer === "undefined") { connectFailed("Couldn't load the connection library. Check the internet and refresh."); return; }
  clearTimeout(client.retryTimer);
  const gen = ++client.gen;
  if (client.peer) { try { client.peer.destroy(); } catch (e) {} }
  client.conn = null;
  const peer = new Peer();
  client.peer = peer;
  let opened = false;
  const fail = why => { if (gen !== client.gen) return; client.gen++; clearTimeout(watchdog); connectFailed(why); };
  const watchdog = setTimeout(() => { if (!opened) fail("Couldn't reach room " + client.code + ". Check the code and try again."); }, 10000);
  peer.on("open", () => {
    if (gen !== client.gen || client.conn) return;
    const conn = peer.connect(PREFIX + client.code, { reliable:true });
    client.conn = conn;
    conn.on("open", () => {
      if (gen !== client.gen) return;
      opened = true; clearTimeout(watchdog);
      client.joined = true; client.tries = 0; client.lastMsg = Date.now();
      store("sixpack_room", JSON.stringify({ code:client.code, t:Date.now() }));
      showController(true);
      client.sent = false;
      safeSend(conn, { type:"JOIN", playerId:myPlayerId, name:client.name });
    });
    conn.on("data", msg => { if (gen === client.gen) handleClientMessage(msg); });
    conn.on("close", () => fail("Connection to the host closed."));
  });
  peer.on("error", err => {
    if (err.type === "peer-unavailable") { if (!client.joined && gen === client.gen) store("sixpack_room", null); fail("Room " + client.code + " wasn't found. Check the code on the big screen."); }
    else if (!opened) fail("Connection problem (" + err.type + "). Try again.");
  });
}
function connectFailed(why) {
  if (client.joined && client.tries < 8) {
    if (document.visibilityState === "visible") client.tries++;
    setBanner("📡", "Reconnecting...", "Hang tight. Your score is saved on the host.");
    client.retryTimer = setTimeout(connectToHost, 2000);
    return;
  }
  leaveRoom(false, why);
}
function leaveRoom(forget, message) {
  client.gen++; client.joined = false; clearTimeout(client.retryTimer);
  if (client.peer) { try { client.peer.destroy(); } catch (e) {} }
  client.peer = null; client.conn = null; client.key = ""; client.endsAt = 0;
  if (forget) store("sixpack_room", null);
  showController(false);
  $("btnJoinRoom").disabled = false;
  $("phoneJoinStatus").textContent = message || "";
}
function showController(on) {
  const entering = on && $("phoneController").hidden;
  $("phoneJoin").hidden = on;
  $("phoneController").hidden = !on;
  document.body.classList.toggle("playing", on && $("phoneView").classList.contains("active"));
  if (entering) { $("ctrlPlayerName").textContent = client.name; setBanner("🎮", "You're In!", "Waiting for the host..."); keepAwake(); }
}
function handleClientMessage(msg) {
  if (!msg || !msg.type) return;
  client.lastMsg = Date.now();
  if (msg.type === "KICK") { leaveRoom(true, "The host removed this controller. Join again any time."); return; }
  if (msg.type === "FULL") { leaveRoom(true, "That room is full (24 players)."); return; }
  if (msg.type === "REPLACED") { leaveRoom(false, "This controller was opened in another tab."); return; }
  if (msg.type !== "STATE") return;
  client.state = msg;
  $("ctrlPlayerName").textContent = `${msg.avatar} ${client.name}`;
  $("ctrlScore").textContent = `${msg.score.toLocaleString()} pts · #${msg.rank}`;
  if (msg.phase === "LOBBY") { client.key = ""; setBanner("🎮", "You're In!", "Waiting for the host to start the game..."); }
  else if (msg.phase === "QUESTION") renderPad(msg);
  else if (msg.phase === "REVEAL" && msg.waiting) setBanner("🎮", "You're In!", "Next question coming up...");
  else if (msg.phase === "REVEAL") {
    const picked = msg.picks.length > 0, got = msg.picks.includes(msg.correctIndex);
    setBanner(got ? "🎉" : picked ? "😬" : "⏰", got ? `+${msg.earned} Points!` : picked ? "Not Quite!" : "Time's Up!",
      `Correct answer: ${TILE_META[msg.correctIndex].letter} — ${msg.correctLabel}`, got ? "#4ade80" : "#f87171");
    if (navigator.vibrate) navigator.vibrate(got ? [40,40,80] : 120);
  } else if (msg.phase === "PODIUM") {
    setBanner(msg.rank === 1 ? "👑" : "🏆", `Finished #${msg.rank} of ${msg.totalPlayers}`, `Final score: ${msg.score.toLocaleString()} pts`, "var(--gold)");
  }
}
function renderPad(s) {
  const fresh = client.key !== s.key;
  if (fresh) {
    client.key = s.key; client.staged = null; client.armed = false; client.sent = false;
    const pad = $("padGrid");
    pad.innerHTML = "";
    s.options.forEach((opt, i) => {
      const m = TILE_META[i], b = document.createElement("button");
      b.type = "button"; b.className = "pad-btn";
      b.innerHTML = `<span class="pad-symbol">${m.letter}</span><span class="pad-text">${escapeHtml(opt)}</span>`;
      b.addEventListener("click", () => handlePadTap(i));
      pad.appendChild(b);
    });
    $("phoneQuestion").textContent = s.question;
    setMedia($("phoneMedia"), s.media && s.media.url, s.media && s.media.caption);
    if (navigator.vibrate) navigator.vibrate(60);
  } else if (!s.locked && client.staged !== null) {
    safeSend(client.conn, { type:"STAGE", key:client.key, choice:client.staged });  /* restore after a reconnect */
  }
  client.endsAt = Date.now() + s.secondsLeft * 1000;
  $("phoneBanner").hidden = true;
  $("padGrid").hidden = false; $("padActionBar").hidden = false; $("phoneQuestion").hidden = false; $("phoneMedia").hidden = false;
  tickPhoneTimer();
  updatePadSelectionUI();
}
function handlePadTap(i) {
  const s = client.state;
  if (!s || s.phase !== "QUESTION" || s.locked || client.sent) return;
  if (navigator.vibrate) navigator.vibrate(25);
  if (!s.safetyNetEnabled) { submitPicks([i]); return; }
  if (client.armed) { if (i !== client.staged) submitPicks([client.staged, i]); return; }
  client.staged = i;
  safeSend(client.conn, { type:"STAGE", key:client.key, choice:i });
  updatePadSelectionUI();
}
function submitPicks(picks) {
  if (client.sent) return;
  if (!client.conn || !client.conn.open) { $("actionHint").hidden = false; $("actionHint").textContent = "📡 Reconnecting... tap again in a moment"; return; }
  client.sent = true; client.armed = false;
  client.state.picks = picks;
  safeSend(client.conn, { type:"PICK", playerId:myPlayerId, key:client.key, picks });
  if (navigator.vibrate) navigator.vibrate([30,40,30]);
  updatePadSelectionUI();
}
function updatePadSelectionUI() {
  const s = client.state;
  if (!s) return;
  const locked = s.locked || client.sent;
  const chosen = locked ? s.picks : client.staged === null ? [] : [client.staged];
  document.querySelectorAll(".pad-btn").forEach((b, i) => {
    b.disabled = locked;
    b.classList.toggle("selected", chosen.includes(i));
    b.classList.toggle("dimmed", locked && !chosen.includes(i));
  });
  const staged = !locked && client.staged !== null;
  $("btnConfirmOne").hidden = !(staged && !client.armed);
  $("btnArmSecond").hidden = !(staged && !client.armed);
  $("btnCancelSecond").hidden = !(staged && client.armed);
  $("actionHint").hidden = staged && !client.armed;
  $("actionHint").textContent = locked ? (chosen.length === 2 ? "🛡️ Both picks locked in!" : "🔒 Locked in! Eyes on the big screen.")
    : client.armed ? "👆 Tap a 2nd answer" : "👆 Tap your answer";
}
function tickPhoneTimer() { if (client.endsAt) $("ctrlTimer").textContent = "⏱ " + Math.max(0, Math.ceil((client.endsAt - Date.now()) / 1000)); }
setInterval(tickPhoneTimer, 500);
setInterval(() => {
  if (!client.joined || !client.conn || !client.conn.open) return;
  if (Date.now() - client.lastMsg > 15000 && document.visibilityState === "visible") { client.lastMsg = Date.now(); connectToHost(); return; }
  safeSend(client.conn, { type:"PING" });
}, 3000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !client.joined) return;
  if (!client.conn || !client.conn.open) { connectToHost(); return; }
  const asked = Date.now(), gen = client.gen;
  safeSend(client.conn, { type:"PING" });
  setTimeout(() => { if (client.joined && gen === client.gen && client.lastMsg < asked) connectToHost(); }, 3000);
});

/* ================= 5. WIRING & BOOT ================= */
$("btnModeHost").addEventListener("click", () => switchMode("host"));
$("btnModePhone").addEventListener("click", () => switchMode("phone"));
$("btnFullscreen").addEventListener("click", () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); });
$("btnAllCats").addEventListener("click", () => setAllCategories(true));
$("btnNoCats").addEventListener("click", () => setAllCategories(false));
$("btnToggleSafetyNet").addEventListener("click", () => { safetyNetEnabled = !safetyNetEnabled; renderSafetyToggle(); });
$("btnAddBot").addEventListener("click", addBotPlayer);
$("btnStartGame").addEventListener("click", startGame);
$("btnRevealEarly").addEventListener("click", revealAnswer);
$("btnNextQuestion").addEventListener("click", () => { if (phase === "REVEAL") nextQuestion(); });
let endArmed = null;
$("btnEndGame").addEventListener("click", () => {
  const b = $("btnEndGame");
  if (!endArmed) { b.textContent = "Tap again to end"; endArmed = setTimeout(() => { endArmed = null; b.textContent = "End Game"; }, 3000); return; }
  clearTimeout(endArmed); endArmed = null; b.textContent = "End Game"; showPodium();
});
$("btnPlayAgain").addEventListener("click", resetToLobby);
$("btnJoinRoom").addEventListener("click", joinRoom);
["inputRoomCode","inputPlayerName"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") joinRoom(); }));
$("btnLeave").addEventListener("click", () => { safeSend(client.conn, { type:"LEAVE" }); setTimeout(() => leaveRoom(true), 150); });
$("btnConfirmOne").addEventListener("click", () => { if (client.staged !== null) submitPicks([client.staged]); });
$("btnArmSecond").addEventListener("click", () => { client.armed = true; updatePadSelectionUI(); });
$("btnCancelSecond").addEventListener("click", () => { client.armed = false; updatePadSelectionUI(); });
window.addEventListener("beforeunload", e => { if (hostPeer && [...players.values()].some(p => !p.isBot)) { e.preventDefault(); e.returnValue = ""; } });

(function boot() {
  const now = new Date();
  if (now.getMonth() === 10 && now.getDate() >= 20) {
    $("lobbyHeading").textContent = "🦃 Happy Thanksgiving! Gather Around!";
    const g = $("lobbyGif"); g.addEventListener("load", () => g.hidden = false); g.src = gifUrl(REACTIONS.lobby[0]);
  }
  renderCategoryChips(); renderSafetyToggle();
  $("inputPlayerName").value = store("sixpack_name") || "";
  const urlRoom = (new URLSearchParams(location.search).get("room") || "").toUpperCase().slice(0, 4);
  let saved = null;
  try { saved = JSON.parse(store("sixpack_room")); } catch (e) {}
  if (saved && Date.now() - saved.t > 3 * 3600 * 1000) saved = null;
  const handheld = window.matchMedia("(pointer: coarse)").matches && Math.min(window.innerWidth, window.innerHeight) < 600;
  const mode = urlRoom || handheld ? "phone" : "host";
  $("inputRoomCode").value = urlRoom || (saved && saved.code) || "";
  switchMode(mode);
  /* Rejoin on its own after a refresh or a dropped tab. */
  if (mode === "phone" && saved && store("sixpack_name") && (!urlRoom || urlRoom === saved.code)) joinRoom();
})();
</script>
