<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Six-Pack Trivia | Pocket Playroom</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface-light:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--gold:#facc15;
--opt-0:#ef4444;--opt-1:#3b82f6;--opt-2:#ca9a04;--opt-3:#0e9f6e;--opt-4:#a855f7;--opt-5:#ea6a0c}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:.45rem .9rem;background:#090d16;border-bottom:1px solid #1e293b;gap:.5rem;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.04em;font-size:1rem;color:var(--accent)}
.brand small{font-size:.72rem;color:var(--muted);font-weight:600;margin-left:.4rem}
.top-right{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.mode-toggle{display:flex;background:var(--surface);border-radius:999px;padding:3px;border:1px solid var(--surface-light)}
.mode-btn{border:none;background:transparent;color:var(--muted);padding:.3rem .8rem;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer}
.mode-btn.active{background:var(--accent);color:#090d16}
.view{display:none;flex:1;width:100%;max-width:1280px;margin:0 auto;padding:.7rem;flex-direction:column;min-height:0}
.view.active{display:flex}
.btn{background:var(--accent);color:#090d16;border:none;padding:.7rem 1.4rem;border-radius:.75rem;font-weight:800;font-size:1rem;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:var(--surface-light);color:var(--text)}
.btn-sm{padding:.42rem .8rem;font-size:.82rem;border-radius:.5rem}
input,select{background:var(--surface);border:2px solid var(--surface-light);color:var(--text);padding:.75rem 1rem;border-radius:.75rem;font-size:1rem;font-weight:600;outline:none}
input:focus,select:focus{border-color:var(--accent)}

/* ---------- Host ---------- */
.host-header{display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:.5rem 1rem;border-radius:1rem;margin-bottom:.7rem;flex-wrap:wrap;gap:.6rem}
.room-badge{font-size:1.1rem;font-weight:800;letter-spacing:.06em}
.room-code{color:var(--gold);background:var(--bg);padding:.1rem .65rem;border-radius:.5rem;margin-left:.35rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.7rem;letter-spacing:.14em}
.muted{color:var(--muted)}
.panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8rem;background:var(--surface);border-radius:1.25rem;padding:1rem}
.lobby-title{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap}
.lobby-title h1{font-size:clamp(1.5rem,3vw,2.3rem)}
.lobby-title img{height:84px;border-radius:.75rem;background:#fff}
.join-line{font-size:clamp(1rem,1.8vw,1.35rem);font-weight:700;line-height:1.5}
.join-line b{color:var(--gold);word-break:break-all}
.cat-board-wrap{width:100%;max-width:860px;background:var(--bg);border:1px solid var(--surface-light);border-radius:1rem;padding:.75rem 1rem}
.cat-board-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem;flex-wrap:wrap;gap:.5rem;font-size:.85rem}
.cat-chip-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem}
.cat-toggle-chip{background:var(--surface);color:var(--muted);border:2px solid var(--surface-light);padding:.35rem .75rem;border-radius:999px;font-size:.82rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.cat-toggle-chip:hover{border-color:var(--accent);color:var(--text)}
.cat-toggle-chip.selected{background:rgba(56,189,248,.18);color:#fff;border-color:var(--accent)}
.options-row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;align-items:center}
.player-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;max-width:900px}
.player-chip{background:var(--bg);border:2px solid var(--surface-light);padding:.4rem .5rem .4rem .9rem;border-radius:999px;font-weight:700;display:flex;align-items:center;gap:.45rem;animation:popIn .25s ease-out}
.player-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0 .25rem}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

#hostStage{flex:1;display:flex;flex-direction:column}
.timer-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem}
.timer-track{flex:1;height:12px;background:var(--surface);border-radius:999px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#facc15);width:100%;transition:width .25s linear}
.timer-num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900;font-size:1.25rem;color:var(--gold);background:var(--surface);padding:.1rem .6rem;border-radius:.5rem;min-width:62px;text-align:center}
.question-card{background:var(--surface);padding:.75rem 1.1rem;border-radius:1.25rem;margin-bottom:.7rem;border:1px solid var(--surface-light);display:flex;align-items:center;justify-content:center;gap:1.25rem;flex-wrap:wrap}
.question-body{flex:1;min-width:260px;text-align:center}
.cat-pill{display:inline-block;background:rgba(56,189,248,.15);color:var(--accent);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;padding:.25rem .8rem;border-radius:999px;margin-bottom:.55rem}
.question-text{font-size:clamp(1.25rem,2.7vw,2.15rem);font-weight:800;line-height:1.25}
.media-frame{--h:clamp(150px,29vh,320px);height:var(--h);width:calc(var(--h) * 1.45);max-width:100%;border-radius:.9rem;overflow:hidden;border:2px solid var(--surface-light);background:#05070d;flex-shrink:0;position:relative}
.meme-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:.8rem;text-align:center;background:radial-gradient(circle at 50% 35%,#334155,#090d16)}
.meme-emoji{font-size:calc(var(--h,200px) * .34);line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
.meme-caption{font-family:Impact,"Arial Narrow",system-ui,sans-serif;font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em;color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;line-height:1.15}
.media-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05070d;opacity:0}
.media-frame.loaded img{opacity:1}
.media-frame .meme-bar{position:absolute;left:0;right:0;bottom:0;padding:.3rem .5rem;display:none;text-align:center}
.media-frame.loaded .meme-bar{display:block}
.host-options{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;margin-bottom:.7rem}
@media (max-width:760px){.host-options{grid-template-columns:repeat(2,1fr)}}
.host-tile{position:relative;background:var(--surface);border-radius:1rem;padding:.7rem .8rem;display:flex;align-items:center;gap:.7rem;border:3px solid transparent;overflow:hidden;transition:transform .25s,opacity .25s,border-color .25s}
.tile-badge{width:46px;height:46px;border-radius:.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.4);z-index:1}
.tile-label{font-size:clamp(1rem,1.8vw,1.4rem);font-weight:800;z-index:1;line-height:1.15}
.vote-bar{position:absolute;left:0;top:0;bottom:0;width:0;opacity:.3;transition:width .7s cubic-bezier(.22,1,.36,1);pointer-events:none}
.vote-count{margin-left:auto;font-weight:900;font-size:.9rem;background:rgba(15,23,42,.8);padding:.2rem .5rem;border-radius:.5rem;z-index:1;white-space:nowrap}
.host-tile.dimmed{opacity:.4}
.host-tile.correct{border-color:#22c55e;transform:scale(1.03);box-shadow:0 0 24px rgba(34,197,94,.4)}
.fact-box{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);padding:.6rem 1rem;border-radius:.9rem;margin-bottom:.7rem;text-align:center;font-size:1.05rem;color:#dcfce7}
.host-dock{margin-top:auto;display:flex;justify-content:space-between;align-items:center;background:var(--surface);padding:.55rem .9rem;border-radius:1rem;flex-wrap:wrap;gap:.6rem}
.dock-avatars{display:flex;flex-wrap:wrap;gap:.4rem;flex:1}
.dock-pill{padding:.3rem .7rem;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--bg);color:var(--muted);border:2px solid transparent}
.dock-pill.locked{color:#fff;border-color:#22c55e;background:rgba(34,197,94,.15)}
.dock-pill.away{opacity:.5;border-style:dashed;border-color:var(--surface-light)}
.dock-pill.miss{color:#fecaca;border-color:#ef4444}
.podium-wrap{display:flex;gap:1.25rem;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.scoreboard-list{width:100%;max-width:560px;display:flex;flex-direction:column;gap:.5rem}
.score-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:.65rem 1.1rem;border-radius:.85rem;font-weight:800;font-size:1.15rem}
.score-row.first{border:2px solid var(--gold);background:rgba(250,204,21,.12);font-size:1.35rem}
.credit{font-size:.7rem;color:var(--muted);text-align:center;padding-top:.35rem}

/* ---------- Phone ---------- */
.phone-join{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.9rem;max-width:420px;width:100%;margin:0 auto}
#phoneController{flex:1;display:flex;flex-direction:column;min-height:0;max-width:560px;width:100%;margin:0 auto;gap:.5rem}
body.playing .top-bar{display:none}
body.playing{height:100vh;height:100dvh;overflow:hidden}
body.playing #phoneView{padding:max(.5rem,env(safe-area-inset-top)) .55rem max(.55rem,env(safe-area-inset-bottom))}
.phone-header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--surface);padding:.4rem .7rem;border-radius:.75rem;font-weight:800;font-size:.9rem;flex-shrink:0}
.phone-header span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnLeave{background:none;border:none;color:var(--muted);font-weight:800;font-size:1rem;padding:.1rem .3rem;cursor:pointer}
.phone-question{flex-shrink:0;font-weight:700;font-size:.92rem;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pad-grid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:.55rem;min-height:0}
.pad-btn{border:none;border-radius:1rem;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.35rem;cursor:pointer;text-align:center;min-height:0;overflow:hidden;box-shadow:inset 0 -5px 0 rgba(0,0,0,.28);touch-action:manipulation;-webkit-user-select:none;user-select:none;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.pad-btn:active:not(:disabled){transform:translateY(2px)}
.pad-btn:disabled{cursor:default}
.pad-btn.dimmed{opacity:.28;filter:grayscale(.5)}
.pad-btn.selected{outline:4px solid #fff;outline-offset:-4px}
.pad-symbol{font-size:clamp(1rem,3.8vh,1.7rem);font-weight:900;line-height:1}
.pad-text{font-size:clamp(.82rem,2.3vh,1.15rem);font-weight:800;line-height:1.12;overflow-wrap:anywhere}
.action-bar{height:64px;flex-shrink:0;display:flex;gap:.5rem;align-items:stretch;justify-content:center}
.action-bar .btn{flex:1;padding:.2rem .4rem;font-size:.95rem;line-height:1.15}
.action-bar .btn small{display:block;font-size:.72rem;font-weight:700}
.action-hint{align-self:center;font-weight:800;color:var(--muted);text-align:center;flex:2}
#btnConfirmOne{background:#22c55e}
#btnArmSecond{background:var(--gold)}
.phone-banner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--surface);border-radius:1.25rem;padding:1.5rem;gap:.7rem;min-height:0}
@media (max-height:640px){.action-bar{height:52px}.phone-question{-webkit-line-clamp:5;font-size:.8rem;line-height:1.2}.pad-text{font-size:.8rem}.pad-symbol{font-size:1rem}#phoneController{gap:.35rem}}
@media (max-height:780px) and (min-width:761px){.media-frame{--h:clamp(130px,23vh,320px)}.question-card{padding:.5rem 1rem;margin-bottom:.5rem}.host-options{gap:.5rem;margin-bottom:.5rem}.host-tile{padding:.5rem .7rem}.tile-badge{width:42px;height:42px}.fact-box{padding:.4rem .8rem;margin-bottom:.5rem;font-size:.98rem}.timer-row{margin-bottom:.45rem}.host-header{margin-bottom:.5rem;padding:.35rem .9rem}#hostView{padding-top:.45rem;padding-bottom:.25rem}.credit{padding-top:.15rem}}
</style>
</head>
<body>

<header class="top-bar">
  <div class="brand">🎲 SIX-PACK TRIVIA<small>POCKET PLAYROOM</small></div>
  <div class="top-right">
    <button id="btnFullscreen" class="btn btn-secondary btn-sm" type="button">⛶ Full Screen</button>
    <div class="mode-toggle">
      <button id="btnModeHost" class="mode-btn" type="button">📺 Host Screen</button>
      <button id="btnModePhone" class="mode-btn" type="button">📱 Phone Controller</button>
    </div>
  </div>
</header>

<main id="hostView" class="view">
  <div class="host-header">
    <div class="room-badge">ROOM CODE: <span id="hostRoomCode" class="room-code">----</span></div>
    <div id="hostStatusText" class="muted" style="font-weight:700;font-size:.9rem">Opening the room...</div>
    <div id="hostRoundBadge" style="font-weight:800;color:var(--accent)">LOBBY</div>
  </div>

  <section id="hostLobby" class="panel">
    <div class="lobby-title">
      <img id="lobbyGif" alt="" hidden />
      <h1 id="lobbyHeading">Gather Around the Screen!</h1>
    </div>
    <p id="joinLine" class="join-line"></p>

    <div class="cat-board-wrap">
      <div class="cat-board-header">
        <span style="font-weight:800;color:var(--accent)">📚 CATEGORIES (<span id="selectedCatCount">12</span>/12)</span>
        <div style="display:flex;gap:.4rem;align-items:center">
          <span id="matchingPoolHint" class="muted" style="margin-right:.35rem"></span>
          <button type="button" id="btnAllCats" class="btn btn-secondary btn-sm">Select All</button>
          <button type="button" id="btnNoCats" class="btn btn-secondary btn-sm">Clear</button>
        </div>
      </div>
      <div id="categoryChipGrid" class="cat-chip-grid"></div>
    </div>

    <div class="options-row">
      <label class="muted" style="font-weight:700;font-size:.9rem">Rounds:
        <select id="roundCountSelect" style="margin-left:.3rem;padding:.35rem .65rem">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="ALL">All Matching</option>
        </select>
      </label>
      <button id="btnToggleSafetyNet" type="button" class="cat-toggle-chip selected"></button>
      <button id="btnAddBot" type="button" class="btn btn-secondary btn-sm">+ Add Test Bot</button>
    </div>

    <div id="lobbyPlayerGrid" class="player-grid"></div>
    <p id="lobbyEmptyHint" class="muted" style="font-size:.9rem">Waiting for at least 1 player (or add a Test Bot)...</p>
    <button id="btnStartGame" class="btn" type="button" disabled>Start Game</button>
  </section>

  <section id="hostStage" hidden>
    <div class="timer-row">
      <div class="timer-track"><div id="timerFill" class="timer-fill"></div></div>
      <div id="timerNum" class="timer-num">60s</div>
    </div>
    <div class="question-card">
      <div id="mediaFrame" class="media-frame"></div>
      <div class="question-body">
        <div id="qCategory" class="cat-pill"></div>
        <div id="qText" class="question-text"></div>
      </div>
    </div>
    <div id="hostOptionsGrid" class="host-options"></div>
    <div id="factBox" class="fact-box" hidden></div>
    <div class="host-dock">
      <div id="dockAvatars" class="dock-avatars"></div>
      <div style="display:flex;gap:.5rem">
        <button id="btnEndGame" class="btn btn-secondary btn-sm" type="button">End Game</button>
        <button id="btnRevealEarly" class="btn btn-secondary btn-sm" type="button">Reveal Now</button>
        <button id="btnNextQuestion" class="btn btn-sm" type="button" hidden>Next Question ➔</button>
      </div>
    </div>
  </section>

  <section id="hostPodium" class="panel" hidden>
    <h1 style="font-size:2.2rem">🏆 Final Standings</h1>
    <div class="podium-wrap">
      <div id="podiumMedia" class="media-frame"></div>
      <div id="finalScoreboard" class="scoreboard-list"></div>
    </div>
    <button id="btnPlayAgain" class="btn" type="button">Play Again</button>
  </section>
  <div class="credit">GIFs via GIPHY</div>
</main>

<main id="phoneView" class="view">
  <section id="phoneJoin" class="phone-join">
    <h2 style="text-align:center;font-size:1.6rem">Join a Room</h2>
    <input id="inputRoomCode" type="text" maxlength="4" placeholder="ROOM CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;text-align:center;font-size:1.5rem;letter-spacing:.2em" />
    <input id="inputPlayerName" type="text" maxlength="14" placeholder="Your Nickname" autocomplete="off" />
    <button id="btnJoinRoom" class="btn" type="button">Connect Controller</button>
    <p id="phoneJoinStatus" class="muted" style="text-align:center;font-size:.9rem"></p>
  </section>

  <section id="phoneController" hidden>
    <div class="phone-header">
      <span id="ctrlPlayerName">Player</span>
      <span id="ctrlTimer" style="color:var(--accent)"></span>
      <span id="ctrlScore" style="color:var(--gold)">0 pts</span>
      <button id="btnLeave" type="button" title="Leave room">✕</button>
    </div>
    <div id="phoneBanner" class="phone-banner">
      <div id="bannerIcon" style="font-size:3rem">🎮</div>
      <h2 id="bannerTitle">Connecting...</h2>
      <p id="bannerSub" class="muted"></p>
    </div>
    <div id="phoneQuestion" class="phone-question" hidden></div>
    <div id="padGrid" class="pad-grid" hidden></div>
    <div id="padActionBar" class="action-bar" hidden>
      <span id="actionHint" class="action-hint"></span>
      <button id="btnConfirmOne" class="btn" type="button" hidden>🔒 Lock 1 Pick<small>Up to 1,000 pts</small></button>
      <button id="btnArmSecond" class="btn" type="button" hidden>🛡️ Add 2nd Pick<small>400 pts flat</small></button>
      <button id="btnCancelSecond" class="btn btn-secondary" type="button" hidden style="flex:.8">Cancel</button>
    </div>
  </section>
</main>

<script>
"use strict";
/* ================= 1. QUESTION BANK & MEDIA ================= */
const QUESTIONS = [
  {"id":1,"category":"Black Culture","question":"In the classic 90s sitcom 'Martin', what are the call letters of the Detroit radio station where Martin Payne works?","mediaCaption":"🎙️ DETROIT RADIO LEGEND","options":["WZUP","WBLK","WJLB","WBLS","KMEL","WVEE"],"answerIndex":0,"fact":"Martin Payne hosted his talk show on WZUP before later transitioning to television on Word on the Street!","gif":"HTytvka5AJIaI"},

  {"id":3,"category":"Black Culture","question":"In the 1995 comedy 'Friday', how much money did Big Worm say Smokey owed him by 10 o'clock?","mediaCaption":"🍦 PLAYING WITH MY MONEY","options":["$100","$200","$500","$1,000","$50","$250"],"answerIndex":1,"fact":"Smokey owed Big Worm $200—which sparked one of the most quoted ice-cream-truck confrontations in movie history.","gif":"l41m44jqM4K1mXQCk"},

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val); } catch (e) { return null; } }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function gifUrl(id) { return id ? "https://media.giphy.com/media/" + id + "/giphy.gif" : ""; }
let wakeLock = null, wantWake = false;
async function keepAwake() { wantWake = true; try { if (navigator.wakeLock && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (wantWake && document.visibilityState === "visible") keepAwake(); });

/* Meme card sits underneath; the GIF covers it only after it loads. */
function setMedia(frame, url, caption) {
  frame.classList.remove("loaded");
  frame.innerHTML = "";
  const parts = String(caption || "🎲 TRIVIA TIME").split(" ");
  const emoji = parts.shift(), words = parts.join(" ");
  const card = document.createElement("div");
  card.className = "meme-card";
  card.innerHTML = `<div class="meme-emoji">${escapeHtml(emoji)}</div><div class="meme-caption">${escapeHtml(words)}</div>`;
  frame.appendChild(card);
  if (!url) return;
  const img = document.createElement("img");
  img.alt = "";
  img.addEventListener("load", () => { if (img.parentNode === frame) frame.classList.add("loaded"); });
  img.addEventListener("error", () => img.remove());
  img.src = url;
  const bar = document.createElement("div");
  bar.className = "meme-bar meme-caption";
  bar.textContent = words;
  frame.append(img, bar);
}

/* ================= 3. HOST ENGINE ================= */
let hostPeer = null, roomCode = "", deck = [], currentIdx = -1, phase = "LOBBY", gameId = 0;
let questionStartTime = 0, timerInterval = null, botTimers = [], revealPending = null;
let safetyNetEnabled = true, botCounter = 0;
const players = new Map();
const selectedCategories = new Set(ALL_CATEGORIES);
const usedIds = new Set();

function generateRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function joinAddress() { return location.protocol.startsWith("http") ? location.host + location.pathname.replace(/index\.html$/, "").replace(/\/$/, "") : ""; }
function renderJoinLine() {
  const addr = joinAddress();
  $("joinLine").innerHTML = addr
    ? `On your phone, go to <b>${escapeHtml(addr)}</b><br>and enter room code <b>${escapeHtml(roomCode)}</b>`
    : `⚠️ Phones can't join a file opened from this computer. Put it online first, then share that web address.`;
}
function initHost() {
  if (typeof Peer === "undefined") { $("hostStatusText").textContent = "⚠️ Couldn't load the connection library. Check the internet and refresh."; return; }
  roomCode = generateRoomCode();
  $("hostRoomCode").textContent = roomCode;
  renderJoinLine();
  $("hostStatusText").textContent = "Opening the room...";
  const peer = new Peer(PREFIX + roomCode);
  hostPeer = peer;
  peer.on("open", () => { $("hostStatusText").textContent = "🟢 Room Open & Ready"; });
  peer.on("disconnected", () => {
    $("hostStatusText").textContent = "🟡 Reconnecting the room...";
    setTimeout(() => { if (hostPeer === peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500);
  });
  peer.on("error", err => {
    if (hostPeer !== peer) return;
    if (err.type === "unavailable-id" && players.size === 0) { peer.destroy(); initHost(); return; }
    $("hostStatusText").textContent = "⚠️ Network hiccup: " + err.type;
    if (peer.destroyed && players.size === 0) setTimeout(() => { if (hostPeer === peer) initHost(); }, 3000);
  });
  peer.on("connection", conn => {
    conn.on("data", msg => handleHostMessage(conn, msg));
    conn.on("close", () => {
      const p = players.get(conn.pid);
      if (p && p.conn === conn) { p.lastSeen = 0; refreshPlayers(); checkAllAnswered(); }
    });
  });
}
function isConnected(p) { return p.isBot || !!(p.conn && p.conn.open && Date.now() - p.lastSeen < 12000); }
function safeSend(conn, data) { try { if (conn && conn.open) conn.send(data); } catch (e) {} }

function newPlayer(id, name, conn, isBot) {
  const taken = new Set([...players.values()].map(p => p.avatar));
  const avatar = AVATARS.find(a => !taken.has(a)) || pickOne(AVATARS);
  return { id, name, avatar, conn, isBot, score:0, streak:0, picks:[], locked:false, staged:null, pickTime:0, lastEarned:0, lastSeen:Date.now() };
}
function handleHostMessage(conn, msg) {
  if (!msg || !msg.type) return;
  if (msg.type === "JOIN") {
    let pid = String(msg.playerId || conn.peer).slice(0, 40);
    const name = String(msg.name || "Player").trim().slice(0, 14) || "Player";
    /* Two tabs on one device share an ID; a different nickname makes a separate player. */
    const holder = players.get(pid);
    if (holder && holder.name !== name && (players.has(pid + "~" + name) || isConnected(holder))) pid += "~" + name;
    let p = players.get(pid);
    if (p) {
      const old = p.conn;
      p.conn = conn; p.lastSeen = Date.now(); p.name = name; conn.pid = pid;
      if (old && old !== conn) { safeSend(old, { type:"REPLACED" }); setTimeout(() => { try { old.close(); } catch (e) {} }, 500); }
    } else {
      if (players.size >= MAX_PLAYERS) { safeSend(conn, { type:"FULL" }); setTimeout(() => { try { conn.close(); } catch (e) {} }, 500); return; }
      p = newPlayer(pid, name, conn, false); conn.pid = pid; players.set(pid, p);
    }
    refreshPlayers(); syncPlayer(p);
    return;
  }
  const p = players.get(conn.pid);
  if (!p || p.conn !== conn) return;
  const wasAway = !isConnected(p);
  p.lastSeen = Date.now();
  if (wasAway) refreshPlayers();
  if (msg.type === "PING") { safeSend(conn, { type:"PONG" }); return; }
  if (msg.type === "LEAVE") { players.delete(p.id); refreshPlayers(); checkAllAnswered(); return; }
  if (phase !== "QUESTION" || msg.key !== roundKey() || p.locked) return;
  const valid = n => Number.isInteger(n) && n >= 0 && n <= 5;
  if (msg.type === "STAGE") { p.staged = safetyNetEnabled && valid(msg.choice) ? msg.choice : null; return; }
  if (msg.type === "PICK") {
    const picks = [...new Set(Array.isArray(msg.picks) ? msg.picks : [])].filter(valid).slice(0, safetyNetEnabled ? 2 : 1);
    if (!picks.length) return;
    p.picks = picks; p.locked = true; p.staged = null; p.pickTime = Date.now();
    renderDock(); syncPlayer(p); checkAllAnswered();
  }
}
setInterval(() => { if (!hostPeer || !players.size) return; renderDock(); checkAllAnswered(); }, 2000);

function addBotPlayer() {
  if (players.size >= MAX_PLAYERS) return;
  const pid = "bot-" + (++botCounter) + "-" + Date.now();
  players.set(pid, newPlayer(pid, BOT_NAMES[(botCounter - 1) % BOT_NAMES.length], null, true));
  refreshPlayers();
}
function removePlayer(id) {
  const p = players.get(id);
  if (!p) return;
  safeSend(p.conn, { type:"KICK" });
  players.delete(id);
  refreshPlayers();
  checkAllAnswered();
}

/* ---- Game flow ---- */
/* Draws evenly across the chosen categories, unseen questions first, then shuffles each option set. */
function buildDeck(count) {
  const buckets = shuffle([...selectedCategories]).map(cat => {
    const all = QUESTIONS.filter(q => q.category === cat);
    return shuffle(all.filter(q => !usedIds.has(q.id))).concat(shuffle(all.filter(q => usedIds.has(q.id))));
  }).filter(b => b.length);
  const out = [];
  while (out.length < count && buckets.some(b => b.length)) {
    for (const b of buckets) { if (out.length >= count) break; if (b.length) out.push(b.shift()); }
  }
  return shuffle(out).map(q => {
    const order = shuffle([0,1,2,3,4,5]);
    return { ...q, options: order.map(i => q.options[i]), answerIndex: order.indexOf(q.answerIndex) };
  });
}
function showHostPanel(name) { $("hostLobby").hidden = name !== "lobby"; $("hostStage").hidden = name !== "stage"; $("hostPodium").hidden = name !== "podium"; }
function startGame() {
  const pool = matchingPool();

  const v = $("roundCountSelect").value;
  deck = buildDeck(v === "ALL" ? pool.length : Math.min(Number(v) || 10, pool.length));
  currentIdx = -1; gameId = Date.now();
  players.forEach(p => { p.score = 0; p.streak = 0; });

  showHostPanel("stage");
  nextQuestion();
}
function roundKey() { return gameId + ":" + currentIdx; }
function clearRoundTimers() { clearInterval(timerInterval); botTimers.forEach(clearTimeout); botTimers = []; clearTimeout(revealPending); revealPending = null; }

function nextQuestion() {
  clearRoundTimers();

  phase = "QUESTION";

  questionStartTime = Date.now();
  players.forEach(p => { p.picks = []; p.locked = false; p.staged = null; p.pickTime = 0; p.lastEarned = 0; });

  $("hostRoundBadge").textContent = `ROUND ${currentIdx + 1} / ${deck.length}`;
  $("qCategory").textContent = q.category;

      <div class="tile-badge" style="background:${m.color}"><span style="font-size:.85rem;line-height:1">${m.shape}</span><span style="font-size:1.1rem;line-height:1">${m.letter}</span></div>
      <div class="tile-label">${escapeHtml(opt)}</div><div class="vote-count" id="voteCount-${i}" hidden></div>`;
    grid.appendChild(tile);
  });

  [q.revealGif, deck[currentIdx + 1] && deck[currentIdx + 1].gif].forEach(id => { if (id) new Image().src = gifUrl(id); });
  renderDock(); broadcastState(); scheduleBotAnswers(q);

  $("timerFill").style.width = "100%";
  $("timerNum").textContent = QUESTION_DURATION + "s";
  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - questionStartTime) / 1000;
    $("timerFill").style.width = Math.max(0, 100 - elapsed / QUESTION_DURATION * 100) + "%";
    $("timerNum").textContent = Math.max(0, Math.ceil(QUESTION_DURATION - elapsed)) + "s";
    if (elapsed >= QUESTION_DURATION) revealAnswer();
  }, 200);
}
function scheduleBotAnswers(q) {
  players.forEach(p => {
    if (!p.isBot) return;
    botTimers.push(setTimeout(() => {
      if (phase !== "QUESTION" || p.locked) return;
      const first = Math.random() < .55 ? q.answerIndex : Math.floor(Math.random() * 6);
      p.picks = [first];
      if (safetyNetEnabled && Math.random() < .35) p.picks.push(pickOne([0,1,2,3,4,5].filter(n => n !== first)));
      p.locked = true; p.pickTime = Date.now();
      renderDock(); checkAllAnswered();
    }, 2500 + Math.random() * 8000));
  });
}
function everyoneIn() { const here = [...players.values()].filter(isConnected); return here.length > 0 && here.every(p => p.locked); }
function checkAllAnswered() {
  if (phase !== "QUESTION" || revealPending || !everyoneIn()) return;
  const key = roundKey();
  revealPending = setTimeout(() => { revealPending = null; if (phase === "QUESTION" && key === roundKey() && everyoneIn()) revealAnswer(); }, 700);
}
function revealAnswer() {
  if (phase !== "QUESTION") return;
  phase = "REVEAL";
  clearRoundTimers();
  $("timerFill").style.width = "0%";
  $("timerNum").textContent = "0s";
  const q = deck[currentIdx], counts = [0,0,0,0,0,0];
  let answered = 0, hits = 0;
  players.forEach(p => {
    if (!p.locked && p.staged !== null) { p.picks = [p.staged]; p.pickTime = Date.now(); }
    p.locked = true;
    if (p.picks.length) answered++;
    p.picks.forEach(i => counts[i]++);
    const hit = p.picks.includes(q.answerIndex);
    if (hit) hits++;
    if (hit && p.picks.length === 1) {
      const elapsed = Math.min(QUESTION_DURATION, (p.pickTime - questionStartTime) / 1000);
      const speed = Math.round(Math.max(0, 1 - elapsed / QUESTION_DURATION) * 400);
      p.streak++;
      p.lastEarned = 600 + speed + (p.streak > 1 ? 100 : 0);
      if (safetyNetEnabled) p.lastEarned = Math.min(1000, p.lastEarned);
    } else {
      p.streak = 0;
      p.lastEarned = hit ? 400 : 0;
    }
    p.score += p.lastEarned;
    p.playedKey = roundKey();
  });
  q.options.forEach((_, i) => {
    const pct = answered ? Math.round(counts[i] / answered * 100) : 0;
    $("voteBar-" + i).style.width = pct + "%";
    const c = $("voteCount-" + i); c.textContent = `${counts[i]} (${pct}%)`; c.hidden = false;
    $("hostTile-" + i).classList.add(i === q.answerIndex ? "correct" : "dimmed");
  });
  const mood = !answered || !hits ? "none" : hits === answered ? "all" : "some";
  const reactionCaption = { all:"🔥 EVERYBODY ATE!", some:"👀 SOME OF Y'ALL KNEW", none:"🤦 NOT ONE OF Y'ALL!" }[mood];
  setMedia($("mediaFrame"), gifUrl(q.revealGif || pickOne(REACTIONS[mood])), reactionCaption);
  $("factBox").innerHTML = `💡 <strong>Did You Know?</strong> ${escapeHtml(q.fact)}`;
  $("factBox").hidden = false;
  $("btnRevealEarly").hidden = true;
  $("btnNextQuestion").hidden = false;
  $("btnNextQuestion").disabled = true;
  setTimeout(() => { $("btnNextQuestion").disabled = false; }, 800);
  $("btnNextQuestion").textContent = currentIdx + 1 >= deck.length ? "See Final Scores 🏆" : "Next Question ➔";
  renderDock(); broadcastState();
}
function ranked() { return [...players.values()].sort((a, b) => b.score - a.score); }
function rankOf(p) { return 1 + [...players.values()].filter(x => x.score > p.score).length; }

function resetToLobby() { clearRoundTimers(); phase = "LOBBY"; showHostPanel("lobby"); $("hostRoundBadge").textContent = "LOBBY"; refreshPlayers(); broadcastState(); }
function renderDock() {

function broadcastState() { players.forEach(syncPlayer); }
function syncPlayer(p) {
  if (!p.conn || !p.conn.open) return;
  const payload = { type:"STATE", phase, key:roundKey(), score:p.score, rank:rankOf(p), totalPlayers:players.size,
    avatar:p.avatar, safetyNetEnabled, picks:p.picks, locked:p.locked };
  if (phase === "QUESTION") {
    const q = deck[currentIdx];   /* anti-cheat: answerIndex and fact are never sent during the round */
    Object.assign(payload, { question:q.question, category:q.category, media:{ url:gifUrl(q.gif), caption:q.mediaCaption },
      options:q.options, round:`${currentIdx + 1}/${deck.length}`, secondsLeft:Math.max(0, QUESTION_DURATION - (Date.now() - questionStartTime) / 1000) });
  } else if (phase === "REVEAL") {

/* ================= 4. PHONE CONTROLLER ================= */
const client = { peer:null, conn:null, gen:0, joined:false, code:"", name:"", lastMsg:0, tries:0, retryTimer:null,
  state:null, key:"", staged:null, armed:false, sent:false, endsAt:0 };
let myPlayerId = store("sixpack_pid");
if (!myPlayerId) { myPlayerId = "player-" + Math.random().toString(36).slice(2, 12); store("sixpack_pid", myPlayerId); }

function setBanner(icon, title, sub, color) {
  $("bannerIcon").textContent = icon; $("bannerTitle").textContent = title; $("bannerTitle").style.color = color || "var(--text)"; $("bannerSub").textContent = sub;
  $("phoneBanner").hidden = false; $("padGrid").hidden = true; $("padActionBar").hidden = true; $("phoneQuestion").hidden = true; $("ctrlTimer").textContent = "";
  client.endsAt = 0;
}
function joinRoom() {
  const code = $("inputRoomCode").value.trim().toUpperCase();
  const name = $("inputPlayerName").value.trim() || "Player";
  if (code.length !== 4) { $("phoneJoinStatus").textContent = "Please enter the 4-character room code."; return; }
  store("sixpack_name", name);
  client.code = code; client.name = name; client.tries = 0; client.joined = false;
  $("btnJoinRoom").disabled = true;
  $("phoneJoinStatus").textContent = "Connecting to room " + code + "...";
  connectToHost();
}
function connectToHost() {
  if (typeof Peer === "undefined") { connectFailed("Couldn't load the connection library. Check the internet and refresh."); return; }
  clearTimeout(client.retryTimer);
  const gen = ++client.gen;
  if (client.peer) { try { client.peer.destroy(); } catch (e) {} }
  client.conn = null;
  const peer = new Peer();
  client.peer = peer;
  let opened = false;
  const fail = why => { if (gen !== client.gen) return; client.gen++; clearTimeout(watchdog); connectFailed(why); };
  const watchdog = setTimeout(() => { if (!opened) fail("Couldn't reach room " + client.code + ". Check the code and try again."); }, 10000);
  peer.on("open", () => {
    if (gen !== client.gen || client.conn) return;
    const conn = peer.connect(PREFIX + client.code, { reliable:true });
    client.conn = conn;
    conn.on("open", () => {
      if (gen !== client.gen) return;
      opened = true; clearTimeout(watchdog);
      client.joined = true; client.tries = 0; client.lastMsg = Date.now();
      store("sixpack_room", JSON.stringify({ code:client.code, t:Date.now() }));
      showController(true);
      client.sent = false;
      safeSend(conn, { type:"JOIN", playerId:myPlayerId, name:client.name });
    });
    conn.on("data", msg => { if (gen === client.gen) handleClientMessage(msg); });
    conn.on("close", () => fail("Connection to the host closed."));
  });
  peer.on("error", err => {
    if (err.type === "peer-unavailable") { if (!client.joined && gen === client.gen) store("sixpack_room", null); fail("Room " + client.code + " wasn't found. Check the code on the big screen."); }
    else if (!opened) fail("Connection problem (" + err.type + "). Try again.");
  });
}
function connectFailed(why) {
  if (client.joined && client.tries < 8) {
    if (document.visibilityState === "visible") client.tries++;
    setBanner("📡", "Reconnecting...", "Hang tight. Your score is saved on the host.");
    client.retryTimer = setTimeout(connectToHost, 2000);
    return;
  }
  leaveRoom(false, why);
}
function leaveRoom(forget, message) {
  client.gen++; client.joined = false; clearTimeout(client.retryTimer);
  if (client.peer) { try { client.peer.destroy(); } catch (e) {} }
  client.peer = null; client.conn = null; client.key = ""; client.endsAt = 0;
  if (forget) store("sixpack_room", null);
  showController(false);
  $("btnJoinRoom").disabled = false;
  $("phoneJoinStatus").textContent = message || "";
}
function showController(on) {
  const entering = on && $("phoneController").hidden;
  $("phoneJoin").hidden = on;
  $("phoneController").hidden = !on;
  document.body.classList.toggle("playing", on && $("phoneView").classList.contains("active"));
  if (entering) { $("ctrlPlayerName").textContent = client.name; setBanner("🎮", "You're In!", "Waiting for the host..."); keepAwake(); }
}
function handleClientMessage(msg) {
  if (!msg || !msg.type) return;
  client.lastMsg = Date.now();
  if (msg.type === "KICK") { leaveRoom(true, "The host removed this controller. Join again any time."); return; }
  if (msg.type === "FULL") { leaveRoom(true, "That room is full (24 players)."); return; }
  if (msg.type === "REPLACED") { leaveRoom(false, "This controller was opened in another tab."); return; }
  if (msg.type !== "STATE") return;
  client.state = msg;
  $("ctrlPlayerName").textContent = `${msg.avatar} ${client.name}`;
  $("ctrlScore").textContent = `${msg.score.toLocaleString()} pts · #${msg.rank}`;
  if (msg.phase === "LOBBY") { client.key = ""; setBanner("🎮", "You're In!", "Waiting for the host to start the game..."); }
  else if (msg.phase === "QUESTION") renderPad(msg);
  else if (msg.phase === "REVEAL" && msg.waiting) setBanner("🎮", "You're In!", "Next question coming up...");
  else if (msg.phase === "REVEAL") {
    const picked = msg.picks.length > 0, got = msg.picks.includes(msg.correctIndex);
    setBanner(got ? "🎉" : picked ? "😬" : "⏰", got ? `+${msg.earned} Points!` : picked ? "Not Quite!" : "Time's Up!",
      `Correct answer: ${TILE_META[msg.correctIndex].letter} — ${msg.correctLabel}`, got ? "#4ade80" : "#f87171");
    if (navigator.vibrate) navigator.vibrate(got ? [40,40,80] : 120);
  } else if (msg.phase === "PODIUM") {
    setBanner(msg.rank === 1 ? "👑" : "🏆", `Finished #${msg.rank} of ${msg.totalPlayers}`, `Final score: ${msg.score.toLocaleString()} pts`, "var(--gold)");
  }
}
function renderPad(s) {
  const fresh = client.key !== s.key;
  if (fresh) {
    client.key = s.key; client.staged = null; client.armed = false; client.sent = false;
    const pad = $("padGrid");
    pad.innerHTML = "";
    s.options.forEach((opt, i) => {
      const m = TILE_META[i], b = document.createElement("button");
      b.type = "button"; b.className = "pad-btn"; b.style.backgroundColor = m.color;
      b.innerHTML = `<span class="pad-symbol">${m.shape} ${m.letter}</span><span class="pad-text">${escapeHtml(opt)}</span>`;
      b.addEventListener("click", () => handlePadTap(i));
      pad.appendChild(b);
    });
    $("phoneQuestion").textContent = s.question;
    if (navigator.vibrate) navigator.vibrate(60);
  } else if (!s.locked && client.staged !== null) {
    safeSend(client.conn, { type:"STAGE", key:client.key, choice:client.staged });  /* restore after a reconnect */
  }
  client.endsAt = Date.now() + s.secondsLeft * 1000;
  $("phoneBanner").hidden = true;
  $("padGrid").hidden = false; $("padActionBar").hidden = false; $("phoneQuestion").hidden = false;
  tickPhoneTimer();
  updatePadSelectionUI();
}
function handlePadTap(i) {
  const s = client.state;
  if (!s || s.phase !== "QUESTION" || s.locked || client.sent) return;
  if (navigator.vibrate) navigator.vibrate(25);
  if (!s.safetyNetEnabled) { submitPicks([i]); return; }
  if (client.armed) { if (i !== client.staged) submitPicks([client.staged, i]); return; }
  client.staged = i;
  safeSend(client.conn, { type:"STAGE", key:client.key, choice:i });
  updatePadSelectionUI();
}
function submitPicks(picks) {
  if (client.sent) return;
  if (!client.conn || !client.conn.open) { $("actionHint").hidden = false; $("actionHint").textContent = "📡 Reconnecting... tap again in a moment"; return; }
  client.sent = true; client.armed = false;
  client.state.picks = picks;
  safeSend(client.conn, { type:"PICK", playerId:myPlayerId, key:client.key, picks });
  if (navigator.vibrate) navigator.vibrate([30,40,30]);
  updatePadSelectionUI();
}
function updatePadSelectionUI() {
  const s = client.state;
  if (!s) return;
  const locked = s.locked || client.sent;
  const chosen = locked ? s.picks : client.staged === null ? [] : [client.staged];
  document.querySelectorAll(".pad-btn").forEach((b, i) => {
    b.disabled = locked;
    b.classList.toggle("selected", chosen.includes(i));
    b.classList.toggle("dimmed", locked && !chosen.includes(i));
  });
  const staged = !locked && client.staged !== null;
  $("btnConfirmOne").hidden = !(staged && !client.armed);
  $("btnArmSecond").hidden = !(staged && !client.armed);
  $("btnCancelSecond").hidden = !(staged && client.armed);
  $("actionHint").hidden = staged && !client.armed;
  $("actionHint").textContent = locked ? (chosen.length === 2 ? "🛡️ Both picks locked in!" : "🔒 Locked in! Eyes on the big screen.")
    : client.armed ? "👆 Tap a 2nd answer" : "👆 Tap your answer";
}
function tickPhoneTimer() { if (client.endsAt) $("ctrlTimer").textContent = "⏱ " + Math.max(0, Math.ceil((client.endsAt - Date.now()) / 1000)); }
setInterval(tickPhoneTimer, 500);
setInterval(() => {
  if (!client.joined || !client.conn || !client.conn.open) return;
  if (Date.now() - client.lastMsg > 15000 && document.visibilityState === "visible") { client.lastMsg = Date.now(); connectToHost(); return; }
  safeSend(client.conn, { type:"PING" });
}, 3000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !client.joined) return;
  if (!client.conn || !client.conn.open) { connectToHost(); return; }
  const asked = Date.now(), gen = client.gen;
  safeSend(client.conn, { type:"PING" });
  setTimeout(() => { if (client.joined && gen === client.gen && client.lastMsg < asked) connectToHost(); }, 3000);
});

(function boot() {
  const now = new Date();
  if (now.getMonth() === 10 && now.getDate() >= 20) {
    $("lobbyHeading").textContent = "🦃 Happy Thanksgiving! Gather Around!";
    const g = $("lobbyGif"); g.addEventListener("load", () => g.hidden = false); g.src = gifUrl(REACTIONS.lobby[0]);
  }
  renderCategoryChips(); renderSafetyToggle();
  $("inputPlayerName").value = store("sixpack_name") || "";
  const urlRoom = (new URLSearchParams(location.search).get("room") || "").toUpperCase().slice(0, 4);
  let saved = null;
  try { saved = JSON.parse(store("sixpack_room")); } catch (e) {}
  if (saved && Date.now() - saved.t > 3 * 3600 * 1000) saved = null;
  const handheld = window.matchMedia("(pointer: coarse)").matches && Math.min(window.innerWidth, window.innerHeight) < 600;
  const mode = urlRoom || handheld ? "phone" : "host";
  $("inputRoomCode").value = urlRoom || (saved && saved.code) || "";
  switchMode(mode);
  /* Rejoin on its own after a refresh or a dropped tab. */
  if (mode === "phone" && saved && store("sixpack_name") && (!urlRoom || urlRoom === saved.code)) joinRoom();
})();
</script>
</body>
</html>
