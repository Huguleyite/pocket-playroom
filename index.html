<template id="about-content">
<p>Pocket Playroom is an independent collection of browser games. A good word, a clever turn, a small victory, and the occasional sandwich. There’s always room for a little play.</p>
<p>Explore word games, logic puzzles, and quick challenges on your phone, tablet, or computer. No account is needed. Switch on Night Play for an after-dark look and a little extra discovery.</p>
<p>We plan to support Pocket Playroom through affiliate links and advertising. When those links are available, qualifying purchases may earn us a commission at no additional cost to you. Paid placements and affiliate links will be identified where they appear.</p>
<p>Small games. Room for big ideas.</p>
<h3>Entertainment and creative intent</h3>
<p>Pocket Playroom’s games, quizzes, fictional worlds, and other experiences are provided for entertainment and recreational purposes. Quiz results and fictional scenarios are not professional advice, diagnoses, or factual assessments of a person.</p>
<p>Our creative intent is to offer distinctive experiences, not to reproduce another party’s protected characters, artwork, stories, or branding, or to imply a connection with another creator or property.</p>
<h3>Independence and third-party rights</h3>
<p>Pocket Playroom is independently operated. Unless expressly disclosed, Pocket Playroom and its experiences are not affiliated with, sponsored by, endorsed by, or authorized by any third-party game publisher, franchise, brand, or rights holder. Shared genres, themes, or gameplay conventions do not imply such a relationship.</p>
<p>Any third-party names, trademarks, logos, and copyrighted material remain the property of their respective owners. No ownership of third-party intellectual property is claimed. This notice does not grant permission to use another party’s protected material or limit any rights provided by applicable law.</p>
<h3>Development and testing</h3>
<p>Experiences labeled “In development” or “Playtest version” are unfinished and offered for testing. They may contain bugs, incomplete features, or balance issues. Features, rules, availability, and browser-stored progress may change or reset as development continues.</p>

<template id="privacy-content">
<p><em>Last updated: October 23, 2026</em></p>
<h3>Your progress and preferences</h3>
<p>Pocket Playroom does not require an account. Games use browser storage, when available, to remember progress, scores, settings, and related play history. The collection also remembers your last opened game and Night Play preferences.</p>
<p>These saves stay in that browser and are not sent to CJ by the current site code. Clearing this site’s browser data removes them. A different browser, device, or website address has separate saves.</p>
<h3>GitHub</h3>
<p>We use GitHub to maintain the site and GitHub Pages to host it. When this site is served through GitHub Pages, GitHub logs visitors’ IP addresses for security, including visitors who are not signed into GitHub. See <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub’s Privacy Statement</a>.</p>
<h3>Affiliate links and CJ</h3>
<p>Binario and Signal Flow completion panels include a NordVPN affiliate banner supplied through CJ. We may earn a commission on qualifying purchases through it. Opening either panel requests the banner from CJ; following the ad uses a CJ tracking link.</p>
<p>When a CJ banner loads or you follow an affiliate link, CJ and participating advertisers may process IP addresses, browser and device details, cookie or similar identifiers, referring pages, link clicks, and qualifying transaction details. Cookies, pixels, tags, or similar methods may connect a referral with a later transaction.</p>
<p>CJ may share information with advertisers, publishers, service providers, and related companies for these purposes. Purchases take place on the advertiser’s site and are subject to its privacy policy.</p>
<p>For CJ’s practices, retention, privacy rights, and available choices, see its <a href="https://www.cj.com/legal/privacy-policy-services">Services Privacy Notice</a> and <a href="https://www.cj.com/legal/privacy">regional privacy information</a>. CJ privacy questions can be directed to <a href="mailto:privacy@cj.com">privacy@cj.com</a>.</p>
<h3>Other services and your choices</h3>
<p>The site requests fonts from Google Fonts, which sends Google your IP address and browser request information. See <a href="https://policies.google.com/privacy">Google’s Privacy Policy</a>.</p>
<p>The site has no connected analytics service. Binario and Signal Flow completion banners are connected to CJ; other advertisement spaces may promote Pocket Playroom games, Atlas Valley Books, Helios Valley, Read the Room, The Frequency, and VibeFrag. House promotions do not contact an advertising service; following a link opens the promoted site, which has its own privacy practices.</p>
<p>Before opening a game, a local check looks for blocked ad elements and a small file hosted on this site. If ad blocking is detected, please allow ads for Pocket Playroom and try again. This check does not contact advertisers, track you, or send your results anywhere.</p>
<p>You can clear saved data or manage cookies through your browser. Blocking cookies may affect future affiliate attribution; blocking site storage may prevent games from saving. Browser controls may not stop every form of tracking. Use the privacy choices offered by CJ and any advertiser you visit as well.</p>
<h3>Updates</h3>
<p>We will revise this notice when hosting, affiliate partners, or tracking tools change, including any required consent controls before tracking is activated.</p>
