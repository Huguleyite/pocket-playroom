<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="Vault Breakers: a cooperative heist for 1 to 4 players. Play together on Pocket Playroom.">
<link rel="icon" href="../../favicon.ico">
<meta name="theme-color" content="#05070B">
<meta name="color-scheme" content="dark">
<title>Vault Breakers | Pocket Playroom</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--obs:#05070B;--slate:#0B101B;--slate2:#111827;--line:#1B2740;--cyan:#00F0FF;--amber:#FFB800;--crim:#FF3B5C;--em:#00E676;--txt:#C9D6EE;--dim:#6F82A6;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--obs);color:var(--txt);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
.mono{font-family:var(--mono);letter-spacing:.04em}
.dim{color:var(--dim)}
em{font-style:normal}
svg text{font-family:var(--sans)}

/* ------------------------------------------------------------ buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 30px;border-radius:12px;background:linear-gradient(180deg,#0f2a33,#0a1c24);border:2px solid var(--cyan);color:var(--cyan);font-weight:800;letter-spacing:.12em;font-size:18px;transition:transform .12s,box-shadow .2s,background .2s}
.btn:hover:not(:disabled){box-shadow:0 0 22px rgba(0,240,255,.35);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;border-color:#2c3b57;color:#6F82A6;background:#0b101b}
.btn.big{height:72px;padding:0 44px;font-size:24px;background:linear-gradient(180deg,#00323a,#012128);box-shadow:0 0 28px rgba(0,240,255,.18)}
.btn.ghost{background:transparent;border-color:#2c3b57;color:var(--txt)}
.btn.ghost:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.btn.mini{height:38px;padding:0 16px;font-size:14px;border-radius:9px}
.btn.sim{border-style:dashed;border-color:var(--amber);color:var(--amber)}

/* ------------------------------------------------------------ TV stage */
#tvViewport{position:fixed;inset:var(--bar,0px) 0 0 0;overflow:hidden;background:var(--obs);--s:1}
.tv-scale{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s));transform-origin:center center}
.tv-stage{position:absolute;inset:0;background:radial-gradient(1200px 700px at 50% 38%,#0a1222 0%,var(--obs) 70%);animation:drift 120s ease-in-out infinite;will-change:transform;overflow:hidden}
@keyframes drift{0%{transform:translate(0,0)}25%{transform:translate(3px,-3px)}50%{transform:translate(-3px,3px)}75%{transform:translate(3px,3px)}100%{transform:translate(0,0)}}
.tv-stage::before{content:"";position:absolute;inset:-6px;background-image:linear-gradient(rgba(0,240,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.035) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.tv-head{position:relative;height:96px;padding:0 36px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--line);background:rgba(5,7,11,.7)}
.brand{display:flex;align-items:center;gap:16px;min-width:330px}
.brand .logo{width:54px;height:54px}
.brand b{display:block;white-space:nowrap;font-size:26px;letter-spacing:.18em;font-weight:900;color:#E9F1FF}
.brand small{display:block;font-size:13px;letter-spacing:.34em;color:var(--dim);margin-top:2px}
.head-mid{flex:1;display:flex;align-items:center;gap:26px;justify-content:center}
.head-mid.lobbymid{gap:16px}
.lobbymid .rl{font-size:15px;letter-spacing:.3em;color:var(--dim)}
.lobbymid b{font-size:34px;color:var(--cyan);letter-spacing:.16em;text-shadow:0 0 18px rgba(0,240,255,.4)}
.meter{display:flex;align-items:center;gap:16px}
.ml,.stat span{white-space:nowrap;font-size:13px;letter-spacing:.24em;color:var(--dim)}
.mbar{position:relative;width:230px;height:26px;border-radius:13px;background:#0b1220;border:2px solid #25365a;overflow:hidden}
.mbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#00b8c4,var(--cyan));transition:width .7s cubic-bezier(.3,.9,.3,1),background .4s}
.meter.warm .mbar i{background:linear-gradient(90deg,#d99500,var(--amber))}
.meter.hot .mbar i{background:linear-gradient(90deg,#c01f3c,var(--crim));animation:hotpulse 1s infinite}
@keyframes hotpulse{50%{filter:brightness(1.4)}}
.mbar u{position:absolute;top:0;bottom:0;width:2px;background:#05070B;text-decoration:none}
.mbar u:nth-of-type(1){left:25%}.mbar u:nth-of-type(2){left:50%}.mbar u:nth-of-type(3){left:75%}
#mPct{font-size:26px;width:76px;text-align:right;color:#E9F1FF}
.meter.hot #mPct{color:var(--crim)}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat b{font-size:28px;color:#E9F1FF}
.head-right{display:flex;gap:10px;align-items:center}
.hbtn{white-space:nowrap;height:46px;padding:0 14px;display:inline-flex;align-items:center;gap:10px;border-radius:10px;border:1.5px solid #2c3b57;color:var(--txt);font-size:14px;font-weight:800;letter-spacing:.14em;transition:all .15s}
.hbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.hbtn svg{width:24px;height:24px}
.hbtn.tog.on{border-color:var(--amber);color:var(--amber);background:rgba(255,184,0,.08)}
.tv-main{position:absolute;left:0;right:0;top:96px;bottom:0;padding:24px 36px 28px}

/* ------------------------------------------------------------ lobby */
.lobby{height:100%;display:grid;grid-template-columns:1fr 640px;gap:44px}
.lb-left{display:flex;flex-direction:column;gap:20px;min-width:0}
.lb-left h1{margin:6px 0 0;font-size:84px;line-height:1;letter-spacing:.06em;font-weight:900;color:#E9F1FF}
.lb-left h1 em{color:var(--cyan);text-shadow:0 0 28px rgba(0,240,255,.45)}
.tagline{margin:0;font-size:24px;line-height:1.4;color:#9db0d3;max-width:980px}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.diff{padding:16px 20px;border-radius:14px;border:2px solid #25365a;background:rgba(11,16,27,.8);text-align:left;display:flex;flex-direction:column;gap:6px;transition:all .15s}
.diff b{font-size:24px;letter-spacing:.16em}
.diff span{font-size:16px;color:var(--dim);line-height:1.35}
.diff:hover{border-color:#3a5688}
.diff.on{border-color:var(--cyan);background:rgba(0,240,255,.07);box-shadow:0 0 24px rgba(0,240,255,.15) inset}
.diff.on b{color:var(--cyan)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.slot{padding:14px 18px;border-radius:14px;border:2px dashed #25365a;min-height:132px;display:flex;flex-direction:column;gap:6px}
.slot.on{border:2px solid var(--cyan);background:rgba(0,240,255,.05)}
.slot.on.away{border-color:var(--amber);opacity:.7}
.slot .sh{display:flex;justify-content:space-between;align-items:center}
.slot .sh b{font-size:22px;color:var(--cyan)}
.slot .kind{font-size:12px;letter-spacing:.2em;color:var(--dim);border:1px solid #2c3b57;padding:2px 8px;border-radius:99px}
.slot .sn{font-size:22px;font-weight:800;letter-spacing:.06em;color:#E9F1FF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sn.dim{color:#3d4f75}
.slot .sa{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;color:#3d4f75}
.slot .sa i{font-style:normal;font-size:12px;font-weight:900;letter-spacing:.12em;padding:3px 9px;border-radius:99px;border:1.5px solid var(--c);color:var(--c)}
.scale{margin:0;font-size:16px;color:var(--dim)}
.lb-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:auto}
.lb-right{display:flex;flex-direction:column;gap:20px;min-width:0}
.qrcard{padding:24px;border-radius:20px;background:rgba(11,16,27,.85);border:2px solid #25365a;display:flex;flex-direction:column;align-items:center;gap:14px}
.qrbox{width:282px;height:282px;padding:16px;border-radius:14px;background:#7FDCE4;display:flex;align-items:center;justify-content:center;box-shadow:0 0 36px rgba(0,240,255,.18)}
.qrbox img,.qrbox canvas{display:block;width:250px!important;height:250px!important}
.qrbox.off{background:#0b101b;border:2px dashed #2c3b57;box-shadow:none}.qrbox.off .qrwait{color:var(--dim)}
.qrwait{color:#05202a;font-weight:700;text-align:center;font-size:16px;line-height:1.4}
.rc{text-align:center}
.rc span{display:block;font-size:13px;letter-spacing:.3em;color:var(--dim)}
.rc b{display:block;font-size:46px;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 22px rgba(0,240,255,.35)}
.joinurl{font-size:15px;color:var(--dim);text-align:center;word-break:break-all;max-width:560px}
.netstat{width:100%;padding:10px 16px;border-radius:10px;font-size:15px;display:flex;flex-direction:column;gap:2px;text-align:center}
.netstat b{letter-spacing:.2em;font-size:14px}
.netstat span{color:var(--dim);font-size:14px}
.netstat.ok{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.4)}.netstat.ok b{color:var(--em)}
.netstat.wait{background:rgba(255,184,0,.08);border:1px solid rgba(255,184,0,.4)}.netstat.wait b{color:var(--amber)}
.netstat.bad{background:rgba(255,59,92,.09);border:1px solid rgba(255,59,92,.5)}.netstat.bad b{color:var(--crim)}
.legend{padding:20px 24px;border-radius:20px;background:rgba(11,16,27,.7);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.legend h4{margin:0 0 4px;font-size:13px;letter-spacing:.3em;color:var(--dim)}
.lg{display:flex;gap:16px;align-items:center}
.lg svg{width:50px;height:50px;flex:none;background:#0B101B;border-radius:8px}
.lg b{display:block;font-size:16px;letter-spacing:.14em;color:#E9F1FF}
.lg span{display:block;font-size:14px;color:var(--dim)}

.how{padding:18px 24px;border-radius:16px;background:rgba(11,16,27,.6);border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.how div{display:flex;flex-direction:column;gap:4px}
.how b{font-size:14px;letter-spacing:.22em;color:var(--cyan)}
.how span{font-size:16px;line-height:1.4;color:#9db0d3}
.ex .exl{paint-order:stroke;stroke:#052013;stroke-width:5px}
/* ------------------------------------------------------------ game screen */
.game{height:100%;display:grid;grid-template-columns:1232px 1fr;gap:24px}
.board-col{display:flex;align-items:flex-start}
.board-host{width:1232px;height:880px;border-radius:18px;border:2px solid #1d2c4b;background:#070b14;box-shadow:0 0 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,240,255,.05) inset;overflow:hidden}
.board-host svg{display:block;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.tphase{display:flex;align-items:baseline;justify-content:space-between;padding:12px 20px;border-radius:12px;background:rgba(11,16,27,.9);border:1.5px solid #25365a}
.tphase span{font-size:16px;color:var(--dim);letter-spacing:.2em}
.tphase b{font-size:26px;letter-spacing:.2em;color:var(--cyan)}
.tphase.resolving b{color:var(--amber)}.tphase.won b{color:var(--em)}.tphase.lost b{color:var(--crim)}
.locks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.locks i{font-style:normal;padding:8px 6px;text-align:center;border-radius:10px;border:1.5px solid #2c3b57;color:#51658c;font-size:15px;font-weight:900;letter-spacing:.12em;display:flex;flex-direction:column;gap:2px}
.locks i em{font-size:11px;letter-spacing:.2em;font-weight:700}
.locks i.lk{border-color:var(--c);color:var(--c);background:rgba(255,255,255,.03)}
.locks i.out{opacity:.4;border-style:dashed}
.waiting{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;color:var(--dim)}
.side-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.roster{display:flex;flex-direction:column;gap:10px}
.rc-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:rgba(11,16,27,.85);border:1.5px solid #25365a;border-left:6px solid var(--c)}
.rc-row.out{opacity:.4}
.rc-row .rn b{display:block;font-size:22px;letter-spacing:.12em;color:var(--c)}
.rc-row .rn span{display:block;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.rc-row .ro{font-size:16px;color:#9db0d3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:5px}
.pips i{width:11px;height:20px;border-radius:3px;border:1.5px solid #3a4c72}
.pips i.f{background:var(--c);border-color:var(--c)}
.log{padding:14px 18px;border-radius:12px;background:rgba(11,16,27,.7);border:1px solid var(--line);flex:1;min-height:0;overflow:hidden}
.log h4{margin:0 0 8px;font-size:13px;letter-spacing:.3em;color:var(--dim)}
.log p{margin:0 0 8px;font-size:16px;line-height:1.35;color:#b4c3e0}
.log p:first-of-type{color:#E9F1FF}
.deckwrap{flex:1;min-height:0;display:flex}
.simtabs{display:flex;gap:8px}
.simtabs button{min-height:44px;padding:8px 16px;border-radius:9px;border:1.5px solid #2c3b57;font-size:14px;font-weight:800;letter-spacing:.1em;display:flex;gap:8px;align-items:baseline}
.simtabs button small{font-size:11px;color:var(--dim)}
.simtabs button.on{border-color:var(--amber);color:var(--amber)}
.simstage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start}
.simframe{display:none;width:390px;height:844px;zoom:.8;border-radius:34px;border:8px solid #1a2438;box-shadow:0 0 0 2px #2c3b57,0 24px 60px rgba(0,0,0,.6);overflow:hidden;background:var(--obs)}
.simframe.show{display:flex}
.simframe:not(.show){display:none!important}

/* overlays */
.banner{position:absolute;left:1292px;top:948px;width:592px;height:84px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:rgba(5,7,11,.88);border:2px solid var(--cyan);font-size:24px;font-weight:900;letter-spacing:.16em;text-align:center;color:var(--cyan);opacity:0;pointer-events:none;transform:translateY(-8px);z-index:20}
.banner.on{animation:bannerIn 1.4s ease forwards}
.banner.s3{border-color:var(--crim);color:var(--crim)}.banner.s4{border-color:var(--amber);color:var(--amber)}.banner.s1{border-color:#9b7bff;color:#c7b4ff}
@keyframes bannerIn{0%{opacity:0;transform:translateY(-12px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.spotbar{position:absolute;left:1292px;bottom:150px;width:592px;opacity:0;pointer-events:none;z-index:21;display:flex;flex-direction:column;gap:8px}
.spotbar div{padding:14px 24px;border-radius:12px;background:rgba(40,6,14,.92);border:2px solid var(--crim);font-size:20px;font-weight:800;color:#ffd0d9;letter-spacing:.04em}
.spotbar.on{animation:spotIn 2.2s ease forwards}
@keyframes spotIn{0%{opacity:0;transform:translateY(14px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;pointer-events:none;z-index:19;opacity:0;background:radial-gradient(ellipse at center,rgba(255,59,92,0) 45%,rgba(255,59,92,.4) 100%)}
.flash.on{animation:flash .9s ease 2}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.endov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,11,.82);z-index:30;backdrop-filter:blur(6px)}
.endov.on{display:flex}
.endcard{width:1000px;padding:56px 64px;border-radius:26px;background:linear-gradient(180deg,#0e1626,#080c15);border:3px solid var(--cyan);text-align:center;display:flex;flex-direction:column;gap:26px;align-items:center}
.endov.good .endcard{border-color:var(--em);box-shadow:0 0 80px rgba(0,230,118,.22)}
.endov.bad .endcard{border-color:var(--crim);box-shadow:0 0 80px rgba(255,59,92,.25)}
.endcard h2{margin:0;white-space:nowrap;font-size:60px;letter-spacing:.14em;font-weight:900}
.endov.good h2{color:var(--em)}.endov.bad h2{color:var(--crim)}
.endcard p{margin:0;font-size:26px;color:#b4c3e0}
.stats{display:flex;gap:44px}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats span{font-size:13px;letter-spacing:.28em;color:var(--dim)}
.stats b{font-size:42px;color:#E9F1FF}

/* ------------------------------------------------------------ board svg */
.fl{fill:#0B101B;stroke:#16213a;stroke-width:1.5}
.fl.alt{fill:#0D1424}
.ped{fill:#14100a;stroke:#5a4210;stroke-width:3}
.cone{pointer-events:none}
.cone.g{fill:#FF3B5C}.cone.c{fill:#FFB800}
.cone.nx{fill:none;stroke-width:3;stroke-dasharray:9 7;opacity:.55}
.cone.nx.g{stroke:#FF3B5C}.cone.nx.c{stroke:#FFB800}
.beam-glow{stroke:#FF3B5C;stroke-width:14;opacity:.28;stroke-linecap:round}
.beam{stroke:#ff8aa0;stroke-width:4;stroke-linecap:round;stroke-dasharray:14 6;animation:beam 1.2s linear infinite}
@keyframes beam{to{stroke-dashoffset:-20}}
.node{fill:#2a0b14;stroke:#FF3B5C;stroke-width:3}
.lzTile{fill:#1b0710;stroke:#6b1325;stroke-width:3}
.laser.off{opacity:.28}.laser.off .beam{animation:none}
.laser.cut{opacity:.18}
.laser .lzoff{opacity:0;font-size:15px;font-weight:900;fill:#FFB800;letter-spacing:.14em}
.laser.off .lzoff{opacity:1}
.lbl{font-size:15px;font-weight:900;letter-spacing:.12em;fill:#9db0d3}
.relic .halo{fill:#FFB800;opacity:.08}
.relic .case{stroke:#FFB800;opacity:.9}
.relic .rpill rect{fill:#241a02;stroke:#FFB800;stroke-width:2}
.relic .rpill text{fill:#FFD66B;font-size:13px}
.relic .hk{fill:#00F0FF;font-size:15px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.relic.st-cracked .case{stroke:#00F0FF;stroke-dasharray:none}
.relic.st-cracked .halo{fill:#00F0FF;opacity:.14;animation:halo 1.6s infinite}
.relic.st-cracked .rpill rect{stroke:#00F0FF;fill:#02242a}
.relic.st-cracked .rpill text{fill:#7ff6ff}
.relic.st-secured .halo{fill:#00E676;opacity:.18}
.relic.st-secured .case{stroke:#00E676;stroke-dasharray:none}
.relic.st-secured .gem{opacity:.55;filter:saturate(.6)}
.relic.st-secured .rpill rect{stroke:#00E676;fill:#02200f}
.relic.st-secured .rpill text{fill:#8dffc0}
@keyframes halo{50%{opacity:.04}}
.ex .exbg{fill:#052013;stroke:#0f5a34;stroke-width:3}
.ex .brk{stroke:#00E676}
.ex .pad{stroke:#00E676;opacity:.35}
.ex .hpad{font-size:34px;font-weight:900;fill:#00E676;opacity:.5}
.ex .exl{font-size:13px}
.ex .exlock{fill:#FFB800}
.ex .exopen{fill:#00E676;display:none}
.ex .padlock{display:block}
.ex.open .padlock{display:none}.ex.open .exlock{display:none}.ex.open .exopen{display:block}
.ex.open .exbg{fill:#07351f;stroke:#00E676}
.ex.open .pad{opacity:1;animation:padspin 8s linear infinite;transform-origin:center}
.ex.open .hpad{opacity:1}
@keyframes padspin{to{transform:rotate(360deg)}}
.ent{transition:transform .75s cubic-bezier(.45,.05,.2,1)}
.gface,.cturret{transition:transform .6s cubic-bezier(.4,0,.2,1)}
.gtip{fill:#FF3B5C}
.glab{font-size:15px;font-weight:900;fill:#ffd0d9;letter-spacing:.1em}
.cam .clab{font-size:14px;font-weight:900;fill:#FFD66B;letter-spacing:.1em}
.cam .crot{font-size:22px;fill:#FFB800;font-weight:900}
.cam.dead{opacity:.35}
.cam.dead .cturret{filter:grayscale(1)}
.crew .plate rect{fill:#05070B;fill-opacity:.88;stroke-width:2.5}
.crew .plt{font-size:15px;font-weight:900;letter-spacing:.12em}
.crew .plt.mini{font-size:15px}
.crew .lockb{opacity:0;transition:opacity .2s}
.crew .lockb circle{fill:#00E676;stroke:#05070B;stroke-width:3}
.crew .lockb path{fill:none;stroke:#05070B;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.crew.locked .lockb{opacity:1}
.crew.gone{opacity:0;pointer-events:none}
.crew.focus .pawn{filter:drop-shadow(0 0 7px rgba(255,255,255,.55))}

<div id="phoneApp" hidden></div>
<noscript>Vault Breakers needs JavaScript.</noscript>
<script>
/* =====================================================================
   ENGINE: rules, procedural mission generator, solvability checker
   ===================================================================== */
const W = 7, H = 5, HAND = 4;
const DIRS = { UP: [0, -1], RIGHT: [1, 0], DOWN: [0, 1], LEFT: [-1, 0], HOLD: [0, 0] };
const DIRLIST = ['UP', 'RIGHT', 'DOWN', 'LEFT'];
const ARROW = { UP: '↑', RIGHT: '→', DOWN: '↓', LEFT: '←', HOLD: '•' };
const GUARD_R = 2, CAM_R = 3;
const widthOf = d => d >> 1;

const AGENTS = [
  { id: 'CIPHER', color: '#00F0FF', skill: 'Remote Uplink', desc: 'Deploys gadgets up to 3 tiles away' },
  { id: 'FORGE', color: '#00E676', skill: 'Master Breacher', desc: 'Auto-cracks adjacent relic cases after moving' },
  { id: 'LYNX', color: '#FFB800', skill: 'Acrobat', desc: 'Crosses active lasers undetected' },
  { id: 'GHOST', color: '#E040FB', skill: 'Shadow Cloak', desc: 'Invisible to cameras while holding' }
];
const GADGETS = {
  emp: { name: 'EMP GRENADE', short: 'EMP', tgt: true, desc: 'Disables lasers and cameras in a 3×3 area for 1 turn.' },
  smoke: { name: 'SMOKE BOMB', short: 'SMOKE', tgt: true, desc: 'Blocks guard and camera sightlines on the target tile and its neighbors for 1 turn.' },
  decoy: { name: 'HOLOGRAM DECOY', short: 'DECOY', tgt: true, desc: 'Guards within 3 spaces divert toward the decoy instead of patrolling.' },
  cutter: { name: 'THERMAL CUTTER', short: 'CUTTER', tgt: true, desc: 'Cracks an adjacent relic case, or permanently cuts an adjacent laser.' },
  nitro: { name: 'NITRO SPRINT', short: 'NITRO', tgt: false, desc: 'Move 2 spaces in your chosen direction this turn.' },
  grapple: { name: 'GRAPPLE HOOK', short: 'GRAPPLE', tgt: 'opt', desc: 'Pull yourself (or an adjacent teammate) 2 spaces in a straight line over hazards.' }
};
const GADGET_IDS = Object.keys(GADGETS);
const DIFFS = {
  ROOKIE: { relics: 1, guards: 2, cams: 0, lasers: 1, walls: 4, budget: 0, blurb: '1 Relic · 2 Guards' },
  PRO: { relics: 2, guards: 2, cams: 2, lasers: 2, walls: 4, budget: 1, blurb: '2 Relics · 2 Guards · 2 Cameras' },
  MASTERMIND: { relics: 3, guards: 3, cams: 2, lasers: 4, walls: 4, budget: 2, blurb: '3 Relics · 3 Guards · 2 Cameras · Extra Lasers' }
};

const key = (x, y) => x + ',' + y;
const inB = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const clone = o => JSON.parse(JSON.stringify(o));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rng) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const dirFromDelta = (dx, dy) => dx > 0 ? 'RIGHT' : dx < 0 ? 'LEFT' : dy > 0 ? 'DOWN' : 'UP';

function isWall(s, x, y) { return s.walls.some(w => w[0] === x && w[1] === y); }
function passMap(s) {
  const m = new Uint8Array(W * H);
  s.walls.forEach(w => m[w[1] * W + w[0]] = 1);
  s.cameras.forEach(c => m[c.y * W + c.x] = 1);
  return (x, y) => inB(x, y) && !m[y * W + x];
}
function smokeSet(s) {
  const set = new Set();
  (s.smokes || []).forEach(m => [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { if (inB(m.x + dx, m.y + dy)) set.add(key(m.x + dx, m.y + dy)); }));
  return set;
}
function empSet(s) {
  const set = new Set();
  (s.emps || []).forEach(m => { for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if (inB(m.x + dx, m.y + dy)) set.add(key(m.x + dx, m.y + dy)); });
  return set;
}
function laserLive(s, l, emp) { return !l.off && !emp.has(key(l.x, l.y)); }

/* Cells visible from a viewer. Returns [x, y, distance, lateral]. Walls and smoke are opaque. */
function coneCells(s, x, y, dir, range, smoke) {
  const [dx, dy] = DIRS[dir], px = -dy, py = dx, out = [];
  const opaque = (cx, cy) => isWall(s, cx, cy) || smoke.has(key(cx, cy));
  for (let d = 1; d <= range; d++) {
    const wm = widthOf(d);
    for (let w = -wm; w <= wm; w++) {
      const cx = x + dx * d + px * w, cy = y + dy * d + py * w;
      if (!inB(cx, cy) || opaque(cx, cy)) continue;
      let ok = true;
      for (let k = 1; k < d; k++) {
        const ww = Math.round(w * k / d), ix = x + dx * k + px * ww, iy = y + dy * k + py * ww;
        if (!inB(ix, iy) || opaque(ix, iy)) { ok = false; break; }
      }
      if (ok) out.push([cx, cy, d, w]);
    }
  }
  return out;
}
const guardCone = (s, g, smoke) => coneCells(s, g.x, g.y, g.f, GUARD_R, smoke || new Set());
const camCone = (s, c, smoke) => coneCells(s, c.x, c.y, DIRLIST[c.d], CAM_R, smoke || new Set());

function dangerKeys(s) {
  const set = new Set(), none = new Set();
  s.guards.forEach(g => { set.add(key(g.x, g.y)); guardCone(s, g, none).forEach(c => set.add(key(c[0], c[1]))); });
  s.cameras.forEach(c => camCone(s, c, none).forEach(q => set.add(key(q[0], q[1]))));
  s.lasers.forEach(l => { if (!l.off) set.add(key(l.x, l.y)); });
  return set;
}

function bfsNext(pass, fx, fy, tx, ty) {
  if (fx === tx && fy === ty) return null;
  const start = fy * W + fx, prev = new Int16Array(W * H).fill(-1), q = [start];
  prev[start] = start;
  let found = false;
  while (q.length) {
    const c = q.shift(), x = c % W, y = (c / W) | 0;
    if (x === tx && y === ty) { found = true; break; }
    for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
      const nx = x + dx, ny = y + dy;
      if (!inB(nx, ny) || !pass(nx, ny)) continue;
      const n = ny * W + nx;
      if (prev[n] !== -1) continue;
      prev[n] = c; q.push(n);
    }
  }
  if (!found) return null;
  let c = ty * W + tx;
  while (prev[c] !== start) c = prev[c];
  return [c % W, (c / W) | 0];
}

/* One guard step. Mutates g and decoys, returns an event or null. */
function stepGuard(pass, g, decoys) {
  let best = null, bd = 99;
  (decoys || []).forEach(d => { if (d.ttl <= 0) return; const dist = Math.abs(d.x - g.x) + Math.abs(d.y - g.y); if (dist <= 3 && dist < bd) { bd = dist; best = d; } });
  if (best) {
    if (bd === 0) { best.ttl = 0; return { kind: 'inspect', g: g.id, text: g.id + ' inspects the hologram' }; }
    const n = bfsNext(pass, g.x, g.y, best.x, best.y);
    if (n) { g.f = dirFromDelta(n[0] - g.x, n[1] - g.y); g.x = n[0]; g.y = n[1]; return { kind: 'lured', g: g.id, text: g.id + ' diverts toward the decoy' }; }
    return null;
  }
  if (g.x === g.path[g.pi][0] && g.y === g.path[g.pi][1]) g.pi = (g.pi + 1) % g.path.length;
  const t = g.path[g.pi], n = bfsNext(pass, g.x, g.y, t[0], t[1]);
  if (n) {
    g.f = dirFromDelta(n[0] - g.x, n[1] - g.y); g.x = n[0]; g.y = n[1];
    if (g.x === t[0] && g.y === t[1]) g.pi = (g.pi + 1) % g.path.length;
  }
  return null;
}
function advanceHazards(s, decoys) {
  const pass = passMap(s), evs = [];

    }

    ps.forEach((p, i) => p.tx.send({ type: 'ASSIGN_AGENTS', agents: p.agents.slice(), slot: i, name: p.name, players: n }));
  },
  pub(events) {
    const s = clone(this.state); delete s.deck; delete s.discard;
    return { type: 'STATE_SYNC', state: s, events: events || [] };
  },
  sync(events) {
    if (!this.state) return;
    const m = this.pub(events);
    this.players.forEach(p => p.tx.send(m));
    if (!this.busy) TV.refresh(this.state);
    TV.renderSide();
  },

  /* ---------- network callbacks ---------- */
  netJoin(conn, msg) {
    const token = msg.token || ('R' + Math.random().toString(36).slice(2, 9));
    const existing = this.find(token);
    if (existing) return this.netAttach(existing, conn, msg);
    const name = String(msg.name || 'AGENT').slice(0, 14).toUpperCase();
    const p = { token, name, kind: 'remote', conn, tx: null };
    p.tx = { send: m => PeerBridge.sendTo(p.conn, m) };
    conn.vbToken = token;
    const why = this.addPlayer(p);
    if (why) { PeerBridge.sendTo(conn, { type: 'JOIN_DENIED', reason: why }); return; }
    if (this.state) p.tx.send(this.pub());
  },
  netReconnect(conn, msg) {
    const p = this.find(msg.token);
    if (p) this.netAttach(p, conn, msg);
    else this.netJoin(conn, msg);
  },
  netAttach(p, conn, msg) {
    clearTimeout(p.dropTimer);
    p.conn = conn; conn.vbToken = p.token; p.connected = true;
    if (msg && msg.name) p.name = String(msg.name).slice(0, 14).toUpperCase();
    p.tx.send({ type: 'ASSIGN_AGENTS', agents: p.agents.slice(), slot: this.players.indexOf(p), name: p.name, players: this.players.length });
    if (this.state) p.tx.send(this.pub());
    TV.lobbyChanged(); TV.renderSide();
  },
  netPlan(conn, msg) {
    const p = this.find(conn.vbToken); if (p) this.lockPlan(p, msg);
  },
  netDrop(conn) {
    const p = this.players.find(q => q.conn === conn); if (!p) return;
    p.connected = false;
    TV.lobbyChanged(); TV.renderSide();
    if (!this.started) p.dropTimer = setTimeout(() => { if (!p.connected && !this.started) this.removePlayer(p); }, 20000);
  },

  /* ---------- plans ---------- */
  lockPlan(p, msg) {
    const s = this.state;
    if (!s || s.phase !== 'planning' || this.busy) return;
    const i = AGENTS.findIndex(a => a.id === msg.agentId);
    if (i < 0 || !p.agents.includes(i)) { p.tx.send({ type: 'PLAN_REJECTED', agentId: msg.agentId, reason: 'That operative is not assigned to you.' }); return; }
    const a = s.crew[i];
    if (msg.plan == null) { a.locked = false; a.plan = null; this.sync(); return; }
    const err = planError(s, i, msg.plan);
    if (err) { p.tx.send({ type: 'PLAN_REJECTED', agentId: msg.agentId, reason: err }); return; }
    a.plan = { dir: msg.plan.dir, card: msg.plan.card || null, target: msg.plan.target || null }; a.locked = true;
    this.sync();
    if (s.crew.every(c => c.out || c.locked)) setTimeout(() => this.resolve(), 450);
  },

  /* ---------- mission flow ---------- */
  startMission() {
    if (!this.players.length) return;
    this.started = true; this.busy = false;
    this.state = makeLevel(this.diff);
    this.assign();
    TV.showGame();
    this.players.forEach(p => p.tx.send({ type: 'NEW_MISSION', state: this.pub().state, events: [] }));
    TV.refresh(this.state); TV.renderSide();
  },
  newMission() {
    if (this.busy) return;
    this.state = makeLevel(this.diff); this.started = true;
    this.assign();
    TV.hideEnd(); TV.showGame(true);
    this.players.forEach(p => p.tx.send({ type: 'NEW_MISSION', state: this.pub().state, events: [] }));
    TV.refresh(this.state); TV.renderSide();
  },
  toLobby() {
    if (this.busy) return;
    this.state = null; this.started = false;
    this.players = this.players.filter(p => p.kind !== 'local');
    this.players.forEach(p => { p.agents = []; p.tx.send({ type: 'LOBBY' }); });
    this.assign();
    TV.hideEnd(); TV.showLobby();
  },
  solo() {
    this.players.filter(p => p.kind === 'remote').forEach(p => { p.tx.send({ type: 'JOIN_DENIED', reason: 'The host switched to solo / local pass-and-play.' }); try { p.conn.close(); } catch (e) { } });
    this.players = [];
    const p = { token: 'local', name: 'COMMAND DECK', kind: 'local', agents: [], connected: true, tx: { send: m => queueMicrotask(() => { if (TV.deck) TV.deck.receive(m); }) } };
    this.players.push(p);
    TV.pendingDeck = p;
    this.startMission();
  },
  async resolve() {
    const s = this.state;
    if (!s || s.phase !== 'planning' || this.busy) return;
    this.busy = true;
    const res = resolveTurn(s);
    s.phase = 'resolving';
    this.players.forEach(p => p.tx.send(this.pub()));
    TV.renderSide();
    await TV.play(res);
    this.state = res.final;
    this.busy = false;
    const evs = [].concat.apply([], res.frames.map(f => f.events));
    this.assign();
    this.sync(evs);
    if (this.state.phase === 'won' || this.state.phase === 'lost') TV.showEnd(this.state);
  }
};

    body.querySelectorAll('.simframe').forEach(f => f.classList.toggle('show', f.dataset.t === this.activeSim));
  },

  /* ---------- resolution playback ---------- */
  setBanner(t, cls) {
    const b = $('#banner'); b.textContent = t; b.className = 'banner on s' + cls;
    b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  },
  async play(res) {
    const b = this.board;
    for (const f of res.frames) {
      if (f.step === 5) break;
      this.setBanner('STEP ' + f.step + ' · ' + f.label, f.step);
      b.update(f.state, { preview: false });
      this.updateHeader(f.state);
      let delay = 0;
      if (f.step === 2) Sfx.step();
      f.events.forEach(e => { if (e.sfx) { setTimeout(() => Sfx.play(e.sfx), delay); delay += 160; } });
      if (f.step === 4 && f.flash) {
        const fl = $('#flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
        f.events.filter(e => e.kind === 'spot').forEach(e => { const a = f.state.crew[e.i]; b.ping(a.x, a.y, '#FF3B5C'); });
        const sb = $('#spotbar'); sb.innerHTML = f.events.filter(e => e.kind === 'spot').map(e => '<div>⚠ ' + esc(e.text) + '</div>').join(''); sb.classList.remove('on'); void sb.offsetWidth; sb.classList.add('on');
      }
      const has = f.events.some(e => e.text);
      const dur = { 1: has ? 1500 : 450, 2: 1050, 3: 1000, 4: f.flash ? 2100 : 600 }[f.step];
      await sleep(dur);
    }
    $('#banner').className = 'banner';
    if (res.final.phase === 'planning') { this.setBanner('PLANNING PHASE · TURN ' + res.final.turn, 0); setTimeout(() => { if (!Host.busy) $('#banner').className = 'banner'; }, 1700); }
  },

  /* ---------- end of mission ---------- */
  showEnd(s) {
    const won = s.phase === 'won', ov = $('#endov');
    won ? Sfx.win() : Sfx.fail();
    ov.className = 'endov on ' + (won ? 'good' : 'bad');
    ov.innerHTML = '<div class="endcard"><h2>' + (won ? 'MISSION COMPLETE' : 'ALARM · LOCKDOWN') + '</h2><p>' + (won ? 'Every relic secured and the whole crew is out clean.' : 'Security alert hit 100%. The vault sealed itself.') + '</p>' +
      '<div class="stats mono"><div><span>TURNS</span><b>' + (s.turn - 1) + '</b></div><div><span>ALERT</span><b>' + s.alert + '%</b></div><div><span>RELICS</span><b>' + s.relics.filter(r => r.st === 'secured').length + '/' + s.relics.length + '</b></div><div><span>CREW OUT</span><b>' + s.crew.filter(a => a.out).length + '/4</b></div></div>' +
      '<div class="lb-actions"><button class="btn big" id="eNew">NEW MISSION · ' + s.diff + '</button><button class="btn ghost" id="eLobby">BACK TO LOBBY</button></div></div>';
    $('#eNew').onclick = () => Host.newMission(); $('#eLobby').onclick = () => Host.toLobby();
  },
  hideEnd() { const ov = $('#endov'); ov.className = 'endov'; ov.innerHTML = ''; $('#spotbar').classList.remove('on'); }
};
/* =====================================================================
   BOOT: route to TV host mode or phone controller mode
   ===================================================================== */
const Phone = {
  ctrl: null,
  start(rawRoom, opts) {
    const app = $('#phoneApp'); app.hidden = false;
    let saved = ''; try { saved = localStorage.getItem('vb-name') || ''; } catch (e) { }
    const room = PeerBridge.normalizeRoom(rawRoom);
    app.innerHTML = '<div class="join"><h1>VAULT <em>BREAKERS</em></h1><p>Join the crew on the big screen. Pick a call sign and confirm the room code shown on the TV.</p>' +
      '<div><label for="jName">CALL SIGN</label><input id="jName" maxlength="14" autocomplete="off" autocapitalize="characters" placeholder="YOUR NAME" value="' + esc(saved) + '"></div>' +
      '<div><label for="jRoom">ROOM CODE</label><input id="jRoom" maxlength="16" autocomplete="off" autocapitalize="characters" placeholder="ABCD" spellcheck="false" value="' + esc(room) + '"></div>' +
      '<small>Enter just the 4 characters, or paste the full room code.</small><div class="err" id="jErr" role="alert"></div><button class="btn big" id="jGo">JOIN CREW</button>' + (opts && opts.note ? '<p class="note">Enter the room code from the host. For a shared device, choose Play options above and start a same-screen game.</p>' : '<p class="note">Tip: join from the same Wi-Fi as the host laptop for the best connection.</p>') + '</div>';
    const go = () => {
      const name = $('#jName').value.trim().toUpperCase() || 'AGENT', rm = PeerBridge.normalizeRoom($('#jRoom').value);
      if (!/^PPR-VB-[A-Z0-9]{4}$/.test(rm)) { $('#jErr').textContent = 'Enter the 4-character room code from the TV.'; return; }
      try { localStorage.setItem('vb-name', name); } catch (e) { }
      Sfx.unlock(); this.connect(name, rm);
    };
    $('#jGo').onclick = go;
    $('#jRoom').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    $('#jName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#jRoom').focus(); });
    /* automatic rejoin when this tab already holds a session token for the room */
    if (/^PPR-VB-[A-Z0-9]{4}$/.test(room) && PeerBridge.token(room) && saved) this.connect(saved, room);
  },
  connect(name, room) {
    const app = $('#phoneApp'); app.innerHTML = '';
    const c = this.ctrl = new Controller(app, {
      header: true, room: room, sound: true,
      send: m => PeerBridge.sendPlan(m.agentId, m.plan),
      onRetry: () => { PeerBridge.retry(); }
    });
    try { history.replaceState(null, '', location.pathname + '?room=' + room); } catch (e) { }
    PeerBridge.initController(room, name, {
      onStatus: (st, detail) => c.setStatus(st === 'connected' ? 'connected' : st, detail),
      onMessage: m => c.receive(m)
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) PeerBridge.resumeIfNeeded(); });
    addEventListener('online', () => PeerBridge.resumeIfNeeded());
  }
};

(function boot() {
  const q = new URLSearchParams(location.search), room = q.get('room'), mode = q.get('mode');
  const unlock = () => { Sfx.unlock(); };
  addEventListener('pointerdown', unlock, { once: true, passive: true });
  addEventListener('keydown', unlock, { once: true });
  if (room !== null) { Phone.start(room); return; }
  if (mode === 'join') { Phone.start('', { note: true }); return; }
  if (mode === 'host' || mode === 'local') {
    $('#tvViewport').hidden = false;
    TV.init(mode === 'local');
    if (mode === 'local') { Host.diff = q.get('difficulty') in DIFFS ? q.get('difficulty') : 'ROOKIE'; Host.solo(); }
    return;
  }
  const setup = $('#setup'); setup.hidden = false;
  setup.innerHTML = '<div class="setup-inner"><h1>VAULT <em>BREAKERS</em></h1><p class="setup-intro">Plan the heist. Escape together. Choose how your crew wants to play.</p><div class="setup-grid"><section class="setup-card primary"><h2>Play on this screen</h2><p>Solo or together: take turns planning Cipher, Forge, Lynx and Ghost on one device. No room code, phones or network connection needed after the game loads.</p><label for="localDifficulty">Mission difficulty</label><select id="localDifficulty"><option value="ROOKIE">Rookie — 1 relic, 2 guards</option><option value="PRO">Pro — 2 relics, guards and cameras</option><option value="MASTERMIND">Mastermind — extra relics and hazards</option></select><button class="btn" id="startLocal">Start same-screen game</button><small>Choose a move, optionally use a gadget, then lock the plan. The next operative is selected for you. Share the controls or command the whole crew yourself. A landscape screen gives you more room.</small></section><section class="setup-card"><h2>Join a room</h2><p>Have a code from another screen? Enter its four characters here.</p><form id="quickJoin"><label for="quickRoom">Room code</label><input class="room-entry" id="quickRoom" maxlength="16" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false" required><p class="err" id="quickError" role="alert"></p><button class="btn" type="submit">Join room</button></form><details class="setup-host"><summary>Host with phones</summary><p>Open a room on this screen, then let each phone join using the code or QR. Some networks block phone connections. Same-screen play is always available.</p><a class="btn" href="?mode=host">Open phone-host lobby</a></details></section></div></div>';
  $('#startLocal').onclick = () => { location.href = '?mode=local&difficulty=' + $('#localDifficulty').value; };
  $('#quickJoin').onsubmit = e => { e.preventDefault(); const code = PeerBridge.normalizeRoom($('#quickRoom').value.trim()); if (!/^PPR-VB-[A-Z0-9]{4}$/.test(code)) { $('#quickError').textContent = 'Enter the four characters shown on the host screen.'; $('#quickRoom').focus(); return; } location.href = '?room=' + encodeURIComponent(code); };

})();
</script>
