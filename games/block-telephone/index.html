<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Block Telephone · Pocket Playroom</title>
<style>
:root{--bg:#0b1020;--panel:#151c34;--panel2:#1d2646;--line:#2a3560;--ink:#f4f6ff;--mute:#93a0c8;--accent:#ffd166;--good:#06d6a0;--bad:#ef476f;--blue:#5cc8ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font:inherit;color:inherit}
canvas{display:block}
.btn{background:var(--accent);color:#241a00;font-weight:800;border-radius:.8em;padding:.75em 1.2em;box-shadow:0 .2em 0 #b88a1e;transition:transform .08s}
.btn:active{transform:translateY(.15em);box-shadow:0 .05em 0 #b88a1e}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 .2em 0 #0d1330}
.btn.alt:active{box-shadow:0 .05em 0 #0d1330}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.good{background:var(--good);color:#032b20;box-shadow:0 .2em 0 #04926f}
.hide{display:none!important}

/* ---------- landing ---------- */
.landing{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px;text-align:center}
.landing h1{font-size:clamp(34px,7vw,72px);letter-spacing:-.02em;line-height:1}
.landing h1 span{color:var(--accent)}
.landing p{color:var(--mute);max-width:560px;line-height:1.45;font-size:clamp(15px,2.4vw,19px)}
.landing .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.landing .btn{font-size:clamp(16px,2.6vw,20px)}
.landing .join{display:flex;gap:8px;align-items:center}
.landing input{background:var(--panel);border:2px solid var(--line);border-radius:.7em;padding:.65em .8em;text-transform:uppercase;width:11em;text-align:center;letter-spacing:.06em}
.stepper{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:.9em;padding:.35em .6em;font-weight:700}
.stepper button{background:var(--panel2);width:2em;height:2em;border-radius:.6em;font-weight:900}
.hero{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(260px,60vw);transform:rotate(-4deg)}
.hero i{aspect-ratio:1;border-radius:4px;display:block}

/* ---------- TV ---------- */
.tvwrap{container-type:size;width:min(100vw,177.78vh);aspect-ratio:16/9;margin:0 auto;position:relative;background:radial-gradient(120% 120% at 50% 0%,#18224a 0%,#0b1020 70%);overflow:hidden}
body.local .tvwrap{width:min(100vw,1000px);margin:10px auto 0;border-radius:14px;border:2px solid var(--line)}
.tv{position:absolute;inset:0;font-size:1.5cqw;padding:2.2em 3em;display:flex;flex-direction:column}
.tv h1{font-size:3.1em;letter-spacing:-.02em;line-height:1}
.tv h2{font-size:2.1em;line-height:1.1}
.tv .sub{color:var(--mute);font-size:1.15em}
.tv .logo{font-weight:900;color:var(--accent);letter-spacing:.02em}
.lobbygrid{display:grid;grid-template-columns:auto 1fr;gap:3em;margin-top:1.4em;flex:1;min-height:0}
.qrbox{background:#fff;border-radius:1em;padding:.8em;width:15.5em;height:15.5em}
.qrbox svg{width:100%;height:100%;display:block}
.code{font-size:2.2em;font-weight:900;letter-spacing:.04em;margin-top:.5em;color:var(--accent)}
.url{font-size:.8em;color:var(--mute);margin-top:.3em;max-width:19em;word-break:break-all}
.warn{background:#3a2a10;border:1px solid #8a6a20;color:#ffd98a;border-radius:.7em;padding:.6em .8em;font-size:.85em;margin-top:.8em;max-width:24em;line-height:1.35}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em;align-content:start}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:1em;padding:.7em .5em;text-align:center;font-weight:800}
.pcard .av{font-size:2.4em;line-height:1.1}
.pcard .nm{font-size:1.05em;margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.empty{opacity:.35;border-style:dashed;font-weight:600;color:var(--mute)}
.pcard.off{opacity:.5}
.pcard .st{font-size:.85em;color:var(--mute);margin-top:.2em;min-height:1.2em}
.pcard.done{border-color:var(--good)}
.pcard.done .st{color:var(--good)}
.chips{display:flex;gap:.5em;margin:.4em 0 0;flex-wrap:wrap}
.chip{background:var(--panel2);border:2px solid transparent;border-radius:2em;padding:.35em .9em;font-weight:700;font-size:.95em}
.chip.on{border-color:var(--accent);color:var(--accent)}
.bar{height:.8em;background:var(--panel);border-radius:1em;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent));width:100%;transition:width .2s linear}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em}
.bignum{font-size:9em;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.tvrow{display:flex;gap:.6em;justify-content:center;margin-top:1em;flex-wrap:nowrap;width:100%}
.tvrow .pcard{flex:1 1 0;min-width:0;max-width:9em}
.tvbtns{display:flex;gap:.8em;margin-top:auto;padding-top:1em;align-items:center;flex-wrap:wrap}
.tvbtns .btn{font-size:1.1em}
.rvhead{display:flex;justify-content:space-between;align-items:baseline}
.prompt{font-size:2.6em;font-weight:900;color:var(--accent);margin:.15em 0 .4em}
.strip{display:flex;gap:.7em;align-items:center;flex:1;min-height:0;container-type:size}
.tile{flex:1 1 0;min-width:0;min-height:0;text-align:center;opacity:1;display:flex;flex-direction:column;align-items:center}
.tile .lb,.tile .sm{width:100%}
.tile .cv{flex:none;width:min(calc((100cqw - (var(--n,4) - 1) * .7em) / var(--n,4)),calc(100cqh - 3.4em));max-width:100%;aspect-ratio:1;background:#0f1630;border:2px solid var(--line);border-radius:.8em;overflow:hidden;position:relative}
.tile .cv canvas{width:100%;height:100%}
.tile.ghost .cv{opacity:.25;display:flex;align-items:center;justify-content:center;font-size:2.4em;color:var(--mute)}
.tile .lb{font-size:.85em;margin-top:.4em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sm{font-size:.75em;color:var(--mute);margin-top:.1em}
.tile.pop .cv{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.driftline{text-align:center;font-size:1.6em;font-weight:800;margin-top:.5em;min-height:1.3em}
.votegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em;margin-top:1em}
.vcard{background:var(--panel);border:2px solid var(--line);border-radius:1em;padding:.6em;text-align:center}
.vcard .pr{font-weight:800;font-size:.95em;margin-bottom:.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .pair{display:flex;gap:.4em;align-items:center}
.vcard .pair .cv{flex:1;aspect-ratio:1;background:#0f1630;border-radius:.6em;overflow:hidden}
.vcard .pair canvas{width:100%;height:100%}
.vcard .pair b{color:var(--mute)}
.winners{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;margin-top:1em;flex:1;min-height:0}
.wcard{background:var(--panel);border:2px solid var(--accent);border-radius:1.2em;padding:1em;display:flex;flex-direction:column;gap:.5em;min-height:0}
.wcard h3{font-size:1.4em}
.wcard .meta{color:var(--mute);font-size:.9em}
.wcard .pair{display:flex;gap:.6em;align-items:center;flex:1;min-height:0}
.wcard .pair .cv{flex:1;aspect-ratio:1;background:#0f1630;border-radius:.8em;overflow:hidden;max-height:100%}
.wcard .pair canvas{width:100%;height:100%}
.wcard .pair b{font-size:1.6em;color:var(--mute)}
.passing{font-size:2.2em;font-weight:900}
.tvnote{position:absolute;right:1.4em;top:1.2em;color:var(--mute);font-size:.8em}

/* ---------- local test strip ---------- */
#phones{display:none}
body.local #phones{display:flex;gap:14px;padding:14px;overflow-x:auto;align-items:flex-start;justify-content:flex-start}
.pframe{flex:0 0 auto;width:300px}
.pframe .cap{font-size:12px;color:var(--mute);margin:0 0 4px 4px;display:flex;justify-content:space-between;align-items:center}
.pframe .cap button{background:var(--panel2);border-radius:6px;padding:2px 8px;font-size:12px}
.phonewrap{container-type:size;width:300px;height:620px;border-radius:22px;border:3px solid #2a3560;overflow:hidden;position:relative;background:var(--bg)}

/* ---------- phone ---------- */
.phroot{position:fixed;inset:0;container-type:size;background:var(--bg)}
.phone{position:absolute;inset:0;font-size:clamp(13px,2.1cqh,19px);display:flex;flex-direction:column;padding:1.2cqh 3cqw;gap:1cqh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.phone.pad{padding:5cqh 6cqw}
.phone h1{font-size:2em;line-height:1.1}
.phone p{color:var(--mute);line-height:1.4}
.phone .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.4cqh}
.phone .big{font-size:5em;line-height:1}
.phone input.nm{background:var(--panel);border:2px solid var(--line);border-radius:.8em;padding:.7em .9em;width:100%;text-align:center;font-size:1.2em;font-weight:700}
.phone .btn{font-size:1.15em;width:100%}
.phone .roster2{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center;max-width:100%}
.phone .roster2 span{background:var(--panel);border-radius:2em;padding:.25em .7em;font-size:.9em}
.hdr{display:flex;align-items:center;gap:.6em;min-height:5.5cqh}
.hdr .rnd{background:var(--panel2);border-radius:2em;padding:.25em .7em;font-size:.8em;font-weight:800;white-space:nowrap}
.hdr .what{flex:1;font-weight:900;font-size:1.05em;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.hdr .what small{display:block;color:var(--mute);font-weight:600;font-size:.7em}
.hdr .tm{font-weight:900;font-size:1.5em;font-variant-numeric:tabular-nums;min-width:1.7em;text-align:right}
.hdr .tm.low{color:var(--bad)}
.tbar{height:.45cqh;background:var(--panel);border-radius:1em;overflow:hidden;flex:0 0 auto}
.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.edprev{flex:0 0 29cqh;background:#0f1630;border:2px solid var(--line);border-radius:1.2em;overflow:hidden;position:relative}
.edprev canvas{width:100%;height:100%;touch-action:none}
.edprev .hint{position:absolute;left:.6em;bottom:.4em;font-size:.72em;color:var(--mute);pointer-events:none;opacity:.85}
.edprev .rot{position:absolute;right:.4em;top:.4em;display:flex;gap:.3em}
.edprev .rot button,.smallbtn{background:rgba(29,38,70,.9);border-radius:.6em;width:2.4em;height:2.4em;font-size:1em;font-weight:900}
.edgrid{flex:0 0 auto;width:min(94cqw,31cqh);aspect-ratio:1/1;align-self:center;background:#0f1630;border:2px solid var(--line);border-radius:.8em;overflow:hidden;touch-action:none}
.edgrid canvas{width:100%;height:100%;touch-action:none}
.layers{display:flex;gap:.3em;align-items:center}
.layers .lbl{font-size:.7em;color:var(--mute);font-weight:800;width:3em;line-height:1}
.layers button{flex:1;background:var(--panel2);border-radius:.5em;height:2.3em;font-weight:900;border:2px solid transparent}
.layers button.on{background:var(--accent);color:#241a00}
.pal{display:flex;gap:.35em}
.pal button{flex:1;height:2.4em;border-radius:.6em;border:3px solid transparent}
.pal button.on{border-color:#fff;transform:scale(1.08)}
.acts{display:flex;gap:.4em}
.acts button{background:var(--panel2);border-radius:.7em;height:2.6em;flex:0 0 2.8em;font-weight:900}
.acts .done{flex:1;background:var(--good);color:#032b20;font-weight:900;font-size:1.05em}
.acts .done.sure{background:var(--accent);color:#241a00}
.lookcv{flex:1;min-height:0;background:#0f1630;border:2px solid var(--line);border-radius:1.2em;overflow:hidden}
.lookcv canvas{width:100%;height:100%;touch-action:none}
.votes{overflow:auto;flex:1;display:flex;flex-direction:column;gap:1cqh;padding-bottom:1cqh}
.votes h3{font-size:1em;margin-top:.4em}
.vopt{display:flex;align-items:center;gap:.6em;background:var(--panel);border:2px solid var(--line);border-radius:.9em;padding:.4em .6em;text-align:left;width:100%}
.vopt .cv{width:3.4em;height:3.4em;border-radius:.5em;overflow:hidden;background:#0f1630;flex:0 0 auto}
.vopt .cv canvas{width:100%;height:100%}
.vopt span{flex:1;font-weight:700;font-size:.95em}
.vopt.on{border-color:var(--accent);background:#2a2610}
.vopt[disabled]{opacity:.35}
.err{color:var(--bad);font-weight:700}
.tip{color:var(--mute);font-size:.8em;line-height:1.35;max-width:22em;margin:.6em 0 0;text-align:center}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- badges / avatars ---- */
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 42%),var(--bc,#445);box-shadow:inset 0 -.16em 0 rgba(0,0,0,.22),0 .12em 0 rgba(0,0,0,.35),0 0 0 .09em rgba(255,255,255,.85);line-height:1}
.pcard{box-shadow:inset 0 .32em 0 var(--bc,transparent)}
.pcard .av{font-size:1.9em;margin-top:.15em}
.pcard .av .badge{width:1.55em;height:1.55em;font-size:1em}
.hdr .mebadge{width:2.1em;height:2.1em;font-size:1em;flex:0 0 auto}
.phone .mebig{width:1.8em;height:1.8em;font-size:3em;margin-bottom:.1em;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.phone .lobby{gap:1cqh;overflow:auto;justify-content:flex-start;padding-top:2cqh}
.phone .pick{font-weight:800;color:var(--mute);font-size:.95em}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45em;width:min(100%,19em)}
.avgrid button{background:var(--panel2);border:2px solid transparent;border-radius:.9em;min-height:44px;aspect-ratio:1.15;font-size:1.7em;line-height:1;transition:transform .08s,border-color .1s}
.avgrid button.on{border-color:var(--accent);background:#2b3566;transform:scale(1.06)}
.avgrid button.taken{opacity:.22;filter:grayscale(1)}
.phone .roster2 .dot,.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.35em;vertical-align:baseline}
.smallbtn.wide{width:auto;height:auto;padding:.5em 1em;font-size:.9em}
.mutebtn{position:fixed;right:10px;top:10px;z-index:50;background:rgba(29,38,70,.92);border-radius:2em;padding:.45em .9em;font-weight:800;font-size:14px;color:#fff;min-height:44px}
.tv-sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tv{background:linear-gradient(180deg,rgba(7,5,31,.42),rgba(7,5,31,.72))}
.phone-music{flex:0 0 auto;align-self:center;min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:24px;background:rgba(15,22,48,.92);color:var(--ink);font-weight:700}
.phone-music:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---- toy-brick polish ---- */
.btn{background:linear-gradient(#ffe08a,var(--accent));box-shadow:0 .22em 0 #b88a1e,inset 0 .12em 0 rgba(255,255,255,.55)}
.btn:active{transform:translateY(.14em);box-shadow:0 .08em 0 #b88a1e}
.ad{display:flex;flex-direction:column;gap:.15em;align-items:center;text-align:center;text-decoration:none;color:var(--ink);background:rgba(10,14,36,.72);border:1px solid var(--line);border-radius:1em;padding:.6em .9em;margin-top:1.4cqh;width:100%;max-width:21em;min-height:44px}
.ad small{font-size:.68em;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.ad b{font-size:1em}
.ad span{font-size:.82em;color:var(--mute);line-height:1.3}
.ad em{font-style:normal;font-weight:800;font-size:.85em;color:var(--accent);margin-top:.15em}
.edprev,.lookcv{background:radial-gradient(120% 100% at 50% 0%,#1d2a58,#0f1630)}
.palette button.on,.pal button.on{box-shadow:0 0 0 .18em #fff,0 0 .9em rgba(255,255,255,.55)}
/* ---- reveal ---- */
.tile .lb{display:flex;align-items:center;justify-content:center;gap:.25em}
.tile[style*="--bc"] .cv{border-color:var(--bc);box-shadow:0 0 1.2em -.2em var(--bc)}
.tile.pop .cv{animation:slidein .7s cubic-bezier(.2,1.2,.3,1) .6s both}
.tile.pop .lb,.tile.pop .sm{animation:fadein .4s ease .9s both}
@keyframes slidein{0%{transform:translateX(9em) rotate(8deg) scale(.55);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tile .sm{font-weight:800;font-variant-numeric:tabular-nums}
.drift{position:relative;height:1.5em;background:var(--panel);border-radius:1em;overflow:hidden;margin:.5em auto 0;width:70%;opacity:0}
.drift.on{opacity:1}
.drift i{position:absolute;left:0;top:0;bottom:0;width:var(--w);border-radius:1em;transform-origin:left}
.drift.on i{animation:fillbar 1s cubic-bezier(.2,.8,.2,1) .6s both}
.drift i.g{background:linear-gradient(90deg,#06d6a0,#7cf3c9)}.drift i.y{background:linear-gradient(90deg,#ffb703,#ffd166)}.drift i.r{background:linear-gradient(90deg,#ef476f,#ff8fa3)}
.drift span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.driftline .vd{animation:pop .5s cubic-bezier(.2,1.6,.4,1) .6s both;display:inline-block}
.wcard.win{box-shadow:0 0 2em -.4em var(--accent);position:relative}
.wcard .trophy{position:absolute;right:.6em;top:.2em;font-size:2.6em;animation:trophy 1.4s cubic-bezier(.2,1.6,.4,1) both,float 2.4s ease-in-out 1.4s infinite}
@keyframes trophy{0%{transform:translateY(-3em) scale(.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.12em)}}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){.tile.pop .cv,.tile.pop .lb,.tile.pop .sm,.drift.on i,.driftline .vd,.wcard .trophy,.phone .mebig{animation:none!important}}
</style>
<meta name="description" content="Build it. Pass it. Forget it. Rebuild it. A family party game for 3–8 players, with a TV or laptop and phones.">
<link rel="canonical" href="https://pocketplayroom.com/games/block-telephone/">
<script src="../../recent-games.js" defer></script>
<style id="collection-integration">
:root{--return-height:calc(44px + env(safe-area-inset-top,0px))}
body{padding-top:var(--return-height)}
.block-return{position:fixed;inset:0 0 auto;z-index:100;height:var(--return-height);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 12px 0;background:#0d0d0d;color:#f4e8ca;font:600 14px system-ui;text-decoration:none}
.block-return:focus-visible{outline:2px solid #ffd166;outline-offset:-3px}
#app{min-height:calc(100dvh - var(--return-height))}
.landing{min-height:calc(100dvh - var(--return-height))}
.phroot{top:var(--return-height)}
.mutebtn{top:calc(var(--return-height) + 10px)}
body:not(.local) .tvwrap{width:min(100vw,calc((100dvh - var(--return-height))*16/9))}
button,input,a.block-return{min-width:44px;min-height:44px}
.phone{overflow-y:auto}
.phone button{flex-shrink:0}
.phone .layers button,.phone .pal button{min-width:0;min-height:44px}
.phone .layers,.phone .pal,.phone .acts{flex-shrink:0}
.phone .edprev .rot button,.phone .smallbtn{width:44px;height:44px}
@container(max-width:440px){
 .phone .layers{display:grid;grid-template-columns:32px repeat(4,minmax(44px,1fr));gap:3px}
 .phone .layers .lbl{grid-row:span 2;align-self:center}
 .phone .pal{display:grid;grid-template-columns:repeat(4,minmax(44px,1fr));gap:3px}
 .phone .edprev{flex-basis:17cqh}
 .phone .edgrid{width:min(94cqw,22cqh)}
}
.landing .join{flex-wrap:wrap;justify-content:center}
@media(max-height:500px){.phroot{position:absolute;min-height:650px}.phone{font-size:14px}}
</style>
</head>
<body>
<a class="block-return" href="../../#big-screen">Back to Pocket Playroom</a>
<div id="app"></div>
<div id="phones"></div>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],

      for (let z = 0; z < G; z++) for (let x = 0; x < G; x++) if (!grid[idx(x, 0, z)]) list.push({ x, z, dep: (x - 4 + 0.5) * sy + (z - 4 + 0.5) * cy });

      for (const q of list) stud(q.x - 4 + 0.5, 0, q.z - 4 + 0.5, 0.22, 0.09, pc, 1);
    }
  };
  // floor
  const plane = (Y, a) => {
    ctx.globalAlpha = 1;
    polys([[-4, Y, -4], [4, Y, -4], [4, Y, 4], [-4, Y, 4]].map(p => proj(p[0], p[1], p[2])), `rgba(255,255,255,${a})`, null);
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = Math.max(1, lw * 0.6);

      let a1 = proj(-4 + i, Y, -4), a2 = proj(-4 + i, Y, 4); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]);
      a1 = proj(-4, Y, -4 + i); a2 = proj(4, Y, -4 + i); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]);

  };

  if (L == null) {
    basePlate();
    for (const b of vox) drawVox(b, 1);

    basePlate();
    if (L === 0) plane(0, 0.14);
    for (const b of vox) if (b.y < L) drawVox(b, 1);
    if (L > 0) plane(L, 0.12);
    for (const b of vox) if (b.y >= L) drawVox(b, b.y === L ? 1 : 0.16);
  }
}

/* animation registry */
const anims = new Set();
const dprOf = () => Math.min(2, window.devicePixelRatio || 1);
function sizeCanvas(c) {
  const r = c.getBoundingClientRect();
  const w = Math.round(r.width * dprOf()), h = Math.round(r.height * dprOf());
  if (w < 4 || h < 4) return false;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return true;
}
let lastT = performance.now();
function loop(t) {
  const dt = Math.min(100, t - lastT); lastT = t;
  for (const a of anims) {
    if (!a.c.isConnected) { anims.delete(a); continue; }
    if (!sizeCanvas(a.c)) continue;
    a.draw(a.c.getContext('2d'), a.c.width, a.c.height, t, dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* a canvas that shows a grid, slowly spinning */
function spinCanvas(grid, o = {}) {
  const c = document.createElement('canvas');
  const phase = o.phase || 0, speed = o.speed == null ? 0.00055 : o.speed;
  anims.add({ c, draw: (ctx, W, H, t) => renderVoxels(ctx, W, H, grid, phase + t * speed, { fit: o.fit || 12.2, pitch: 0.6, dy: o.dy || 0 }) });
  return c;
}

/* touch/mouse drag to orbit a view: st = { yaw, pitch }. Horizontal drag turns, vertical drag tilts. */
function bindDrag(el, st, onMove) {
  el.style.touchAction = 'none'; el.style.cursor = 'grab';
  let id = null, lx = 0, ly = 0;
  el.addEventListener('pointerdown', e => { id = e.pointerId; lx = e.clientX; ly = e.clientY; try { el.setPointerCapture(id); } catch (x) {} el.style.cursor = 'grabbing'; e.preventDefault(); });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    st.yaw -= dx * 0.012; st.pitch = Math.max(0.12, Math.min(1.4, st.pitch + dy * 0.008));
    if (onMove) onMove(-dx * 0.012);
  });
  const end = e => { if (e.pointerId === id) { id = null; el.style.cursor = 'grab'; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

    const cellAt = e => { const r = gcv.getBoundingClientRect(); const dx = Math.floor((e.clientX - r.left) / r.width * G), dz = Math.floor((e.clientY - r.top) / r.height * G); if (dx < 0 || dz < 0 || dx >= G || dz >= G) return null; return this.toGrid(dx, dz); };

  showVote(m) {

/* =====================================================================
   HOST (TV / laptop)
   ===================================================================== */
class Host {
  constructor(wrap, opt) {
    this.local = !!opt.local; this.players = []; this.phase = 'boot'; this.N = 0;
    this.settings = { buildMs: 60000, lookMs: LOOK_MS };
    this.autoReveal = true; this.hostRound = 0;
    { const mb = document.createElement('button'); mb.className = 'mutebtn'; mb.textContent = sfx.muted ? '🔇 Sound off' : '🔊 Sound on'; mb.onclick = () => { sfx.toggle(); mb.textContent = sfx.muted ? '🔇 Sound off' : '🔊 Sound on'; }; document.body.appendChild(mb); }
    const sky = document.createElement('canvas'); sky.className = 'tv-sky'; sky.setAttribute('aria-hidden', 'true'); wrap.appendChild(sky);
    const paintSky = () => { const r = wrap.getBoundingClientRect(), W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height)); if (sky.width === W && sky.height === H) return; sky.width = W; sky.height = H; sky.getContext('2d').drawImage(spaceBg(W, H), 0, 0); };
    this.skyObserver = new ResizeObserver(paintSky); this.skyObserver.observe(wrap); paintSky();
    this.tv = document.createElement('div'); this.tv.className = 'tv'; wrap.appendChild(this.tv);
    this.opt = opt;
    window.addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && this.phase === 'reveal') { e.preventDefault(); this.revealNext(true); } });
    setInterval(() => this.tick(), 200);
    if (this.local) { this.roomId = 'LOCAL TEST'; this.phase = 'lobby'; this.renderLobby(); }
    else this.startNet();
  }

  /* ---- network ---- */
  startNet() {
    this.tv.innerHTML = `<div class="center"><div class="logo">BLOCK TELEPHONE</div><h2>Opening a room…</h2></div>`;
    if (typeof Peer === 'undefined') return this.netFail('The connection library did not load.');
    const tryOpen = n => {
      const id = 'PPR-BT-' + rand4();
      let peer; try { peer = new Peer(id, { config: { iceServers: STUN } }); } catch (e) { return this.netFail(String(e)); }
      peer.on('open', () => { this.peer = peer; this.roomId = id; this.phase = 'lobby'; this.renderLobby(); });
      peer.on('error', e => {
        if (e.type === 'unavailable-id' && n < 5) { try { peer.destroy(); } catch (x) {} tryOpen(n + 1); }
        else if (!this.peer || !this.peer.open) this.netFail(e.type);

      peer.on('connection', conn => this.onConn(conn));
      peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    };
    tryOpen(0);
  }
  netFail(why) {
    this.tv.innerHTML = `<div class="center"><div class="logo">BLOCK TELEPHONE</div><h2>Couldn't open a room</h2><p class="sub">Could not reach the matchmaking server (${esc(why)}). Check your internet connection, then try again. You can also use Local test mode.</p><div class="tvrow"><button class="btn" id="rt">Try again</button><button class="btn alt" id="lc">Local test mode</button></div></div>`;
    this.tv.querySelector('#rt').onclick = () => this.startNet();
    this.tv.querySelector('#lc').onclick = () => { location.search = '?local=1'; };
  }
  onConn(conn) {
    conn.on('data', m => {
      if (m && m.t === 'HELLO') { const ch = { send: o => { try { conn.send(o); } catch (e) {} }, conn }; const p = this.hello(m, ch); if (p) conn._pl = p; }
      else if (conn._pl) this.onMsg(conn._pl, m);
    });
    const gone = () => { const p = conn._pl; if (p && p.ch && p.ch.conn === conn) { p.connected = false; p.goneAt = performance.now(); this.refresh(); } };
    conn.on('close', gone); conn.on('error', gone);
  }

  /* ---- players ---- */
  roster() { return this.players.map(p => ({ n: p.name, a: p.avatar, i: p.avIdx, c: p.color, on: p.connected })); }
  broadcast(m) { for (const p of this.players) if (p.connected) p.ch.send(m); }
  hello(m, ch) {
    let p = m.token && this.players.find(x => x.token === m.token);
    if (p) { p.ch = ch; p.connected = true; p.goneAt = 0; this.sync(p); this.refresh(); return p; }
    if (this.phase !== 'lobby') { ch.send({ t: 'ERR', msg: 'This game has already started. Hang tight for the next one!' }); return null; }
    if (this.players.length >= MAX_PLAYERS) { ch.send({ t: 'ERR', msg: 'This room is full (8 players).' }); return null; }
    const used = new Set(this.players.map(x => x.avIdx));
    let av = (Number.isInteger(m.av) && m.av >= 0 && m.av < AVATARS.length && !used.has(m.av)) ? m.av : -1;
    if (av < 0) { av = 0; while (used.has(av)) av++; }
    const usedC = new Set(this.players.map(x => x.ci)); let ci = 0; while (usedC.has(ci)) ci++;
    const name = (m.name || '').trim().slice(0, 12) || ('Player ' + (this.players.length + 1));
    p = { name, avIdx: av, avatar: AVATARS[av], ci, color: COLORS[ci % COLORS.length], token: m.token, ch, connected: true, draft: null, submitted: false, goneAt: 0 };
    this.players.push(p); sfx.pop();
    ch.send({ t: 'WELCOME', me: { name: p.name, avatar: p.avatar, color: p.color, i: p.avIdx }, players: this.roster() });

  sync(p) {

    if (this.phase === 'round') ch.send(this.roundMsg(p)); else if (this.phase === 'passing') ch.send({ t: 'WAIT' });

    else if (this.phase === 'results') ch.send({ t: 'RESULT' });

  onMsg(p, m) {
    if (m.t === 'AVATAR') {
      if (this.phase !== 'lobby') return;
      const i = m.i;
      if (Number.isInteger(i) && i >= 0 && i < AVATARS.length && !this.players.some(x => x !== p && x.avIdx === i)) { p.avIdx = i; p.avatar = AVATARS[i]; }
      p.ch.send({ t: 'WELCOME', me: { name: p.name, avatar: p.avatar, color: p.color, i: p.avIdx }, players: this.roster() });
      this.broadcast({ t: 'LOBBY', players: this.roster() }); this.refresh(); return;

  /* ---- game flow ---- */
  startGame() {

        <button class="btn alt" id="au">Auto: ${this.autoReveal ? 'on' : 'off'}</button><span class="sub">Space also advances</span></div>`;
    this.tv.querySelector('#nx').onclick = () => this.revealNext(true);
    this.tv.querySelector('#au').onclick = e => { this.autoReveal = !this.autoReveal; rv.last = performance.now(); e.target.textContent = 'Auto: ' + (this.autoReveal ? 'on' : 'off'); };
    this.tv.querySelectorAll('.cv[data-k]').forEach(cv => { const k = +cv.dataset.k; if (rv.step > k) cv.appendChild(spinCanvas(decGrid(c.builds[k]), { phase: k * 0.7, fit: 11.6 })); });
    if (rv.fresh) {
      rv.fresh = false;
      const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      const delay = calm ? 0 : 600;
      if (!calm) sfx.drum(delay);
      setTimeout(() => {
        if (this.phase !== 'reveal' || this.rv !== rv) return;
        sfx.hit();
        const sm = this.tv.querySelector('.tile.pop .sm[data-pct]');
        if (sm) this.countUp(sm, +sm.dataset.pct, v => v + '% match', calm);
        const dn = this.tv.querySelector('.dn');
        if (dn) { this.countUp(dn, +dn.dataset.pct, v => v + '%', calm); setTimeout(() => (+dn.dataset.pct >= 66 ? sfx.fanfare() : sfx.wobble()), 700); }
      }, delay);
    }
  }
  countUp(el, to, fmtFn, instant) {
    if (instant || to <= 0) { el.textContent = fmtFn(to); return; }
    const t0 = performance.now(), dur = 750;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmtFn(Math.round(to * e)); if (k < 1 && el.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  pairHTML(k) { return `<div class="pair"><div class="cv" data-g="${k}o"></div><b>➜</b><div class="cv" data-g="${k}f"></div></div>`; }
  mountPairs(root) {
    root.querySelectorAll('.cv[data-g]').forEach(cv => { const k = parseInt(cv.dataset.g, 10), isF = cv.dataset.g.endsWith('f'); const ch = this.chains[k]; cv.appendChild(spinCanvas(decGrid(isF ? ch.builds[this.N - 1] : ch.builds[0]), { phase: isF ? 1.1 : 0.3, fit: 11.6 })); });
  }
  renderVote() {
    this.tv.innerHTML = `
      <div class="rvhead"><div class="logo">VOTE TIME</div><div class="sub" id="vn">${this.voteCount()}</div></div>
      <h2 style="margin-top:.2em">Pick two chains on your phone</h2>
      <p class="sub">🎯 Most faithful &nbsp;·&nbsp; 🤪 Most wonderfully wrong</p>
      <div class="votegrid">${this.chains.map((c, k) => `<div class="vcard"><div class="pr">${esc(c.prompt)}</div>${this.pairHTML(k)}</div>`).join('')}</div>
      <div class="tvbtns"><button class="btn" id="sr">Show results</button></div>`;
    this.mountPairs(this.tv);
    this.tv.querySelector('#sr').onclick = () => this.showResults();
  }
  renderResults() {
    const tally = cat => { const t = new Array(this.N).fill(0); Object.values(this.votes[cat]).forEach(c => { t[c]++; }); const mx = Math.max(...t); return { t, mx, win: mx > 0 ? t.map((v, i) => v === mx ? i : -1).filter(i => i >= 0) : [] }; };
    const f = tally('faithful'), w = tally('wrong');
    const card = (title, tl) => {
      if (!tl.win.length) return `<div class="wcard"><h3>${title}</h3><div class="meta">No votes were cast.</div></div>`;
      const k = tl.win[0], c = this.chains[k], names = [...new Set(c.builders.map(i => this.players[i].avatar + ' ' + this.players[i].name))].join(', ');
      const more = tl.win.length > 1 ? ` (tie with ${tl.win.slice(1).map(i => '“' + esc(this.chains[i].prompt) + '”').join(', ')})` : '';
      return `<div class="wcard win"><div class="trophy">🏆</div><h3>${title}</h3><div class="prompt" style="font-size:1.7em;margin:0">“${esc(c.prompt)}”</div><div class="meta">${tl.mx} vote${tl.mx > 1 ? 's' : ''}${more}</div>${this.pairHTML(k)}<div class="meta">Built by ${esc(names)}</div></div>`;
    };
    // biggest drift
    let worst = 0, wv = 2; this.chains.forEach((c, k) => { const s = similarity(decGrid(c.builds[0]), decGrid(c.builds[this.N - 1])); if (s < wv) { wv = s; worst = k; } });
    this.tv.innerHTML = `
      <div class="rvhead"><div class="logo">RESULTS</div><div class="sub">Biggest drift: “${esc(this.chains[worst].prompt)}” kept only ${Math.round(wv * 100)}% of its shape</div></div>
      <div class="winners">${card('🎯 Most Faithful', f)}${card('🤪 Most Wonderfully Wrong', w)}</div>
      <div class="tvbtns"><button class="btn" id="again">Play again (same players)</button><button class="btn alt" id="lob">Back to lobby</button></div>`;
    this.mountPairs(this.tv);
    sfx.fanfare(); confetti(this.tv);
    this.tv.querySelector('#again').onclick = () => this.startGame();
    this.tv.querySelector('#lob').onclick = () => this.toLobby();
  }
}

/* =====================================================================
   BOOT
   ===================================================================== */
const app = document.getElementById('app'), phonesBox = document.getElementById('phones');
const qs = new URLSearchParams(location.search);

function landing() {
  let n = 4;
  app.innerHTML = `<div class="landing">
    <div class="hero">${Array.from({ length: 64 }, (_, i) => { const on = [9, 10, 17, 18, 19, 25, 26, 27, 28, 33, 34, 35, 36, 37, 41, 42, 43, 44, 45, 46, 52, 53, 14, 22].includes(i); return `<i style="background:${on ? COLORS[(i * 3) % 8] : 'transparent'}"></i>`; }).join('')}</div>
    <h1>Block <span>Telephone</span></h1>
    <p>Everyone builds from a secret prompt on their phone. Pass the build on, rebuild it from memory, and watch the TV reveal how it all fell apart.</p>
    <div class="row"><button class="btn" id="host">Host on this screen</button></div>
    <div class="row"><div class="stepper"><button id="m">−</button><span id="n">4</span> phones<button id="p">+</button></div><button class="btn alt" id="loc">Local test (no phones needed)</button></div>
    <div class="row join"><input id="code" placeholder="PPR-BT-XXXX" maxlength="12"><button class="btn alt" id="jn">Join with code</button></div>
  </div>`;
  const nEl = app.querySelector('#n');
  app.querySelector('#m').onclick = () => { n = Math.max(3, n - 1); nEl.textContent = n; };
  app.querySelector('#p').onclick = () => { n = Math.min(8, n + 1); nEl.textContent = n; };
  app.querySelector('#host').onclick = () => { location.search = '?host=1'; };
  app.querySelector('#loc').onclick = () => { location.search = '?local=' + n; };
  app.querySelector('#jn').onclick = () => { const c = app.querySelector('#code').value.trim().toUpperCase(); if (c) location.search = '?room=' + c; };
}

function runHost(local, n) {
  document.body.classList.toggle('local', local);
  app.innerHTML = '<div class="tvwrap" id="tvw"></div>';
  const host = new Host(document.getElementById('tvw'), { local });
  window.__bt = { host, phones: [] };
  if (local) {
    for (let i = 0; i < n; i++) {
      const frame = document.createElement('div'); frame.className = 'pframe';
      const nm = 'Player ' + (i + 1);
      frame.innerHTML = `<div class="cap"><span>${AVATARS[i]} ${nm}</span></div><div class="phonewrap"></div>`;
      phonesBox.appendChild(frame);
      const ph = new Phone(frame.querySelector('.phonewrap'), {
        local: true, name: nm, av: i,
        attach: phone => {
          const ch = { send: m => setTimeout(() => phone.onMsg(clone(m)), 0), conn: null };
          phone.tx = m => setTimeout(() => {
            const mm = clone(m);
            if (mm.t === 'HELLO') { const p = host.hello(mm, ch); phone.player = p; }
            else if (phone.player) host.onMsg(phone.player, mm);
          }, 0);
          phone.join(phone.name);
        }
      });
      window.__bt.phones.push(ph);
    }
  }
}


async function runDiag() {
  app.innerHTML = '<div class="landing" style="align-items:stretch;text-align:left"><h1>Connection <span>check</span></h1><p>Run this on the phone that can\'t connect, then run it on the laptop and compare.</p><pre id="out" style="white-space:pre-wrap;font:15px/1.5 ui-monospace,Consolas,monospace;background:#151c34;border-radius:12px;padding:14px"></pre></div>';
  const out = document.getElementById('out'); const log = t => { out.textContent += t + '\n'; };
  log('Browser: ' + navigator.userAgent.slice(0, 90)); log('Online: ' + navigator.onLine); log('');
  const t0 = performance.now();
  await new Promise(res => {
    if (typeof Peer === 'undefined') { log('1. Matchmaker: library missing'); return res(); }
    let p; const to = setTimeout(() => { log('1. Matchmaker: FAIL (no answer in 8 s). The phone cannot reach peerjs.com.'); try { p.destroy(); } catch (e) {} res(); }, 8000);
    try { p = new Peer({ config: { iceServers: STUN } }); } catch (e) { log('1. Matchmaker: ' + e); return res(); }
    p.on('open', () => { clearTimeout(to); log('1. Matchmaker: OK (' + Math.round(performance.now() - t0) + ' ms)'); p.destroy(); res(); });
    p.on('error', e => { clearTimeout(to); log('1. Matchmaker: ERROR ' + e.type); res(); });
  });
  const probe = async (servers, policy) => {
    const pc = new RTCPeerConnection({ iceServers: servers, iceTransportPolicy: policy || 'all' }); pc.createDataChannel('x');
    const types = {}; pc.onicecandidate = e => { if (e.candidate) { const t = (e.candidate.candidate.match(/typ (\w+)/) || [])[1]; types[t] = (types[t] || 0) + 1; } };
    await pc.setLocalDescription(await pc.createOffer()); await new Promise(r => setTimeout(r, 5000)); pc.close(); return types;
  };
  try { const a = await probe(STUN); log('2. Direct paths: ' + JSON.stringify(a)); log('   ' + (a.srflx ? 'public address found (STUN works)' : 'no public address (STUN blocked?)')); } catch (e) { log('2. Direct paths: ' + e); }
  try { const r = await probe([{ urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }], 'relay'); log('3. Free relay: ' + JSON.stringify(r)); log('   ' + (r.relay ? 'relay available' : 'no relay answered')); } catch (e) { log('3. Free relay: ' + e); }
  log(''); log('Done. Screenshot this page and send it to Claude.');
}

if (qs.get('diag')) {
  runDiag();
} else if (qs.get('room')) {
  document.body.classList.remove('local');
  app.innerHTML = '<div class="phroot" id="pr"></div>';
  new Phone(document.getElementById('pr'), { room: qs.get('room').toUpperCase() });
} else if (qs.get('local')) {
  runHost(true, Math.max(3, Math.min(8, parseInt(qs.get('local'), 10) || 4)));
} else if (qs.get('host')) {
  runHost(false, 0);
} else {
  landing();
}
})();
