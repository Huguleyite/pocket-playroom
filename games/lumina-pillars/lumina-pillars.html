const SFX = Snd.sfx; function audio() { Snd.unlock(); return true; } window.Snd = Snd;

/* ============================== GAME STATE ============================== */
const ROT = ['E', 'N', 'W', 'S'];

let levelIndex = 0, state = null, selected = null, layer = GRID.LAYER_MIN, locked = false, litBefore = new Set();

const $ = id => document.getElementById(id);

function blockColorHex(b) { return b.color ? COLORS[b.color] : null; }

/* ---------- progress, par and stars ---------- */
const SAVE_KEY = 'lumina-pillars-v1';
const WORLDS = [{ name: 'World 1 · Foundations', from: 0, to: 12 }, { name: 'World 2 · Spectrum', from: 12, to: 18 }];
let progress = { best: {} };                       // keyed by level title: { stars, moves }

const bestOf = i => progress.best[LEVELS[i].title];

function disarm() { clearTimeout(armTimer); const b = $('answer'); b.classList.remove('arm'); b.textContent = 'Show answer'; }

const starHtml = (n, total = 3) => Array.from({ length: total }, (_, k) => `<i class="${k < n ? 'f' : ''}">★</i>`).join('');

function renderSelect() {

let savedView = false;
function admireSaved(i) {                              // open a cleared level as a finished board: your own pieces if saved, otherwise the built-in answer

  for (const b of (progress.boards[LEVELS[i].title] || LEVELS[i].solution)) place(state, { ...b });

}
function showSelect() { $('win').classList.remove('show'); renderSelect(); $('select').classList.add('show'); }
function loadLevel(i) {

function hint(msg) { $('hint').textContent = msg || (selected ? `Tap a cell on layer ${layer} to place the ${NAMES[selected]}.` : 'Pick a piece, then tap a cell. Tap a placed piece to turn it. Hold to remove.'); }

function setLayer(l) {

function newBlock(k, pos) {

  if (improved || !progress.boards[LEVELS[levelIndex].title]) { progress.boards[LEVELS[levelIndex].title] = [...state.cells.values()].filter(b => !b.fixed).map(({ fixed, ...r }) => r); saveProgress(); }

  $('winStars').innerHTML = starHtml(stars);
  const shown = bestOf(levelIndex);

  if (showCard && locked) $('win').classList.add('show');

$('admire').onclick = () => {                         // look at the finished board: card and HUD tuck away, camera drifts slowly
  audio(); SFX.select(); $('win').classList.remove('show'); document.body.classList.add('admire'); layerGrid.visible = false; ghost.visible = false;
  const b = bestOf(levelIndex); $('admireTitle').textContent = `${levelIndex + 1} · ${LEVELS[levelIndex].title}` + (b ? '  ' + '★'.repeat(b.stars) + '☆'.repeat(3 - b.stars) : '') + '  ·  drag to look around';
  $('admNext').textContent = levelIndex === LEVELS.length - 1 ? 'All levels' : 'Next level';

$('admBack').onclick = () => { audio(); SFX.select(); const sv = savedView; leaveAdmire(!sv); if (sv) showSelect(); };
$('admNext').onclick = () => { leaveAdmire(false); $('next').onclick(); };
$('admLevels').onclick = () => { leaveAdmire(false); audio(); SFX.select(); showSelect(); };

/* ============================== INPUT ============================== */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();

let down = null, pressTimer = null;

/* ============================== LOOP ============================== */
const clock = new THREE.Clock();
