/* ---------- play ---------- */
function loadLevel(i,keepSel){leaveAdmire(false);Snd.unlock();SFX.level();litB=new Set();li=i;st=makeState(LEVELS[i]);moves=0;assisted=false;log=[];won=false;erase=false;replaying=false;
 $('hint').textContent=LEVELS[i].inventory.BRIDGE ? 'A bridge sends a matching beam under two tiles. Tap it to turn its arrow.' : 'Pick a piece, tap a tile to place it. Tap a placed piece to turn it. Hold to remove.';
 const ks=Object.keys(LEVELS[i].inventory);sel=ks[0];$('title').textContent=(i+1)+' · '+LEVELS[i].title;
 try{localStorage.setItem('lumina2d.level',i)}catch(e){}
 $('select').classList.remove('on');$('win').classList.remove('on');fit();renderTray();syncUI()}
function doPlace(pos,k,facing){const{type,color}=typeOf(k);const b={type,pos:[pos[0],1,pos[1]]};if(color)b.color=color;if(rotates(type))b[dirField(type)]=facing||'E';
 st.cells.set(key(pos[0],pos[1]),b);st.inv[k]--;}
function checkWin(){if(won||replaying)return;if(trace(st).won){won=true;setTimeout(showWin,700)}}
function cellAt(ev){const r=cv.getBoundingClientRect(),px=(ev.clientX-r.left)*S/r.width,py=(ev.clientY-r.top)*S/r.height,x=Math.floor((px-pad)/cell),z=N-1-Math.floor((py-pad)/cell);return x>=0&&x<N&&z>=0&&z<N?[x,z]:null}
let pressT=null,pressed=null,long=false;
cv.addEventListener('pointerdown',e=>{Snd.unlock();if(replaying||won)return;pressed=cellAt(e);long=false;clearTimeout(pressT);
 pressT=setTimeout(()=>{long=true;if(pressed)removeAt(pressed)},520)});
cv.addEventListener('pointermove',e=>{hover=cellAt(e)});cv.addEventListener('pointerleave',()=>{hover=null});
cv.addEventListener('pointerup',e=>{clearTimeout(pressT);if(replaying||won||long||!pressed)return;const c=cellAt(e);if(!c||c[0]!==pressed[0]||c[1]!==pressed[1])return;tapCell(c)});
function removeAt(c){const b=st.cells.get(key(c[0],c[1]));if(!b||b.fixed){if(b)SFX.deny();return}SFX.remove();st.cells.delete(key(c[0],c[1]));st.inv[invKey(b)]++;log.push({a:'rem',c});renderTray();syncUI()}
function tapCell(c){const k=key(c[0],c[1]),b=st.cells.get(k);
 if(b){if(b.fixed){SFX.deny();return}if(erase){removeAt(c);return}
  if(rotates(b.type)){const f=dirField(b.type);b[f]=ROT[(ROT.indexOf(b[f])+1)%4];moves++;log.push({a:'rot',c});SFX.rotate();syncUI();chime();checkWin()}else removeAt(c);return}
 if(erase||!sel||!(st.inv[sel]>0)){if(!erase)SFX.deny();return}doPlace(c,sel);SFX.place();moves++;log.push({a:'put',c,k:sel});if(!(st.inv[sel]>0)){const nx=Object.keys(LEVELS[li].inventory).find(q=>st.inv[q]>0);sel=nx||sel}renderTray();syncUI();chime();checkWin()}
$('snd').onclick=()=>{Snd.toggleSfx();paintSnd()};$('mus').onclick=()=>{Snd.toggleMusic();paintSnd()};paintSnd();
$('erase').onclick=()=>{Snd.unlock();SFX.select();erase=!erase;renderTray();syncUI()};
$('reset').onclick=()=>{if(!replaying)loadLevel(li)};
$('menu').onclick=()=>{Snd.unlock();SFX.select();showSelect()};
addEventListener('pointerdown',()=>Snd.unlock(),{once:true});
$('answer').onclick=()=>{if(replaying)return;st=makeState(LEVELS[li]);log=[];moves=0;assisted=true;
 for(const b of LEVELS[li].solution){const k=invKey(b);doPlace([b.pos[0],b.pos[2]],k,b.facing||b.childDir);log.push({a:'put',c:[b.pos[0],b.pos[2]],k,f:b.facing||b.childDir})}
 won=false;SFX.level();renderTray();syncUI();chime();checkWin()};
/* ---------- win / replay ---------- */
function showWin(){const L=LEVELS[li],par=parOf(L),s=starsFor(moves,par,assisted),t=L.title,old=progress.best[t];
 if(!old||s>old.stars||(s===old.stars&&moves<old.moves)){progress.best[t]={stars:s,moves};saveP()}
 if(!progress.boards[t]||(!old||s>old.stars||(s===old.stars&&moves<old.moves))){progress.boards[t]=[...st.cells.values()].filter(b=>!b.fixed).map(({fixed,...r})=>r);saveP()}SFX.win(s);$('stars').textContent='★'.repeat(s)+'☆'.repeat(3-s);$('wl').textContent=assisted?'Answer shown · capped at 1 star':`${moves} moves · par ${par}`;
 $('next').style.display=li<LEVELS.length-1?'':'none';$('win').classList.add('on')}
let savedView=false;
function admireSaved(i){Snd.unlock();SFX.select();loadLevel(i);for(const b of(progress.boards[LEVELS[i].title]||LEVELS[i].solution)){st.cells.set(key(b.pos[0],b.pos[2]),{...b});st.inv[invKey(b)]--}won=true;renderTray();syncUI();$('admire').onclick();savedView=true}
function leaveAdmire(card){savedView=false;document.body.classList.remove('admire');$('abar').classList.remove('on');if(card&&won)$('win').classList.add('on')}
$('admire').onclick=()=>{Snd.unlock();SFX.select();$('win').classList.remove('on');document.body.classList.add('admire');const b=progress.best[LEVELS[li].title];$('atitle').textContent=(li+1)+' · '+LEVELS[li].title+(b?'  '+'★'.repeat(b.stars)+'☆'.repeat(3-b.stars):'');$('anext').style.display=li<LEVELS.length-1?'':'none';$('abar').classList.add('on')};
$('aback').onclick=()=>{SFX.select();const sv=savedView;leaveAdmire(!sv);if(sv)showSelect()};$('anext').onclick=()=>{leaveAdmire(false);loadLevel(li+1)};$('alev').onclick=()=>{leaveAdmire(false);showSelect()};
$('again').onclick=()=>loadLevel(li);$('next').onclick=()=>loadLevel(li+1);$('tosel').onclick=()=>showSelect();
$('rep').onclick=()=>{const L=log.slice();$('win').classList.remove('on');st=makeState(LEVELS[li]);replaying=true;moves=0;syncUI();let i=0;
 const stepf=()=>{if(i>=L.length){replaying=false;won=true;setTimeout(()=>$('win').classList.add('on'),900);return}
  const a=L[i++];if(a.a==='put'){doPlace(a.c,a.k,a.f)}else if(a.a==='rot'){const b=st.cells.get(key(a.c[0],a.c[1]));const f=dirField(b.type);b[f]=ROT[(ROT.indexOf(b[f])+1)%4]}else{const b=st.cells.get(key(a.c[0],a.c[1]));st.cells.delete(key(a.c[0],a.c[1]));st.inv[invKey(b)]++}
  if(a.a!=='rem')moves++;renderTray();syncUI();setTimeout(stepf,650)};setTimeout(stepf,400)};
/* ---------- level select ---------- */
const unlocked=i=>i===0||!!progress.best[LEVELS[i-1].title]||!!progress.best[LEVELS[i].title];
function showSelect(){const g=$('grid');g.innerHTML='';
 LEVELS.forEach((L,i)=>{const d=document.createElement('button'),b=progress.best[L.title],u=unlocked(i);d.className='lv'+(u?'':' lock');
  d.innerHTML=`<div class="n">${u?i+1:'🔒'}</div><div class="s">${b?'★'.repeat(b.stars)+'☆'.repeat(3-b.stars):u?'☆☆☆':''}</div><div class="nm">${L.title}</div>`;
  if(u)d.onclick=()=>loadLevel(i);if(b){const e=document.createElement('span');e.className='eye';e.textContent='👁';e.onclick=ev=>{ev.stopPropagation();admireSaved(i)};d.appendChild(e)}g.appendChild(d)});
 $('win').classList.remove('on');$('select').classList.add('on')}
window.__lumina2d={LEVELS,get st(){return st},loadLevel,showSelect,trace:()=>trace(st),parOf,progress:()=>progress,tapCell,get moves(){return moves}};
if(/[?&]play/.test(location.search)){let i=0;try{i=Math.min(LEVELS.length-1,parseInt(localStorage.getItem('lumina2d.level')||'0',10)||0)}catch(e){}loadLevel(i)}else showSelect();
</script></body></html>
