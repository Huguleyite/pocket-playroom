<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Complete today's phrase against the clock.">
<title>How's It Go · Pocket Playroom</title>
<link rel="stylesheet" href="style.css">
<script defer src="puzzles.js"></script>
<script defer src="game.js"></script><script src="../../recent-games.js" defer></script>
</head>
<body>
<a class="home-link" href="../../">← Pocket Games</a><main class="cabinet" id="cabinet">
<header><h1>How's It Go</h1><button type="button" id="sound" aria-pressed="true">Sound on</button></header><nav class="game-nav"><span id="rewards" hidden></span></nav>
<section id="splash" class="splash">
<p class="category" id="category"></p>
<h2 id="intro">Finish the phrase</h2>
<p id="allowance"></p>
<p class="instructions">Tap letters to finish the phrase. Tap a selected letter again to remove it.</p><button id="go" type="button">Go</button>
</section>
<section id="play" hidden>
<div class="clock"><div class="track" aria-hidden="true"><div id="bar"></div></div><span id="time"></span></div>
<h2 id="clue"></h2>
<div class="answer" id="answer" aria-label="Answer"></div>
<div id="board" class="board" role="group" aria-label="Scrambled letter tiles"></div>
<p id="status" role="status"></p><div id="retry-actions" hidden><button id="retry" type="button">Try again</button><button id="end-retry" type="button">Show answer</button></div>
</section>
</main>
</body>
</html>
